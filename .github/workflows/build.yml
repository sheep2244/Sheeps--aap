name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --org com.example --project-name sheeps_app

      - name: Overwrite main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() {
            runApp(const SheepsApp());
          }

          class SheepsApp extends StatelessWidget {
            const SheepsApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'AI Sheep Tracker',
                theme: ThemeData(
                  primarySwatch: Colors.green,
                  useMaterial3: true,
                ),
                home: const SheepHome(),
              );
            }
          }

          class SheepHome extends StatefulWidget {
            const SheepHome({super.key});

            @override
            State<SheepHome> createState() => _SheepHomeState();
          }

          class _SheepHomeState extends State<SheepHome> {
            bool isHindi = true;
            int sheepCount = 0;
            int selectedTab = 0;

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text(
                    isHindi ? 'भेड़ ट्रैकिंग एवं पशु स्वास्थ्य' : 'AI Sheep Tracker & Health Care',
                    style: const TextStyle(color: Colors.white, fontSize: 16),
                  ),
                  backgroundColor: Colors.green.shade700,
                  actions: [
                    TextButton.icon(
                      onPressed: () {
                        setState(() {
                          isHindi = !isHindi;
                        });
                      },
                      icon: const Icon(Icons.language, color: Colors.white),
                      label: Text(
                        isHindi ? 'EN' : 'हिंदी',
                        style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold),
                      ),
                    ),
                  ],
                ),
                body: selectedTab == 0
                    ? SingleChildScrollView(
                        padding: const EdgeInsets.all(16.0),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.stretch,
                          children: [
                            Card(
                              elevation: 4,
                              color: Colors.green.shade50,
                              child: Padding(
                                padding: const EdgeInsets.all(16.0),
                                child: Row(
                                  mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                  children: [
                                    Column(
                                      crossAxisAlignment: CrossAxisAlignment.start,
                                      children: [
                                        Text(
                                          isHindi ? 'कुल दर्ज भेड़ें (अधिकतम: 300)' : 'Total Sheeps (Max: 300)',
                                          style: const TextStyle(fontSize: 14),
                                        ),
                                        const SizedBox(height: 5),
                                        Text(
                                          '$sheepCount / 300',
                                          style: TextStyle(fontSize: 28, fontWeight: FontWeight.bold, color: Colors.green.shade800),
                                        ),
                                      ],
                                    ),
                                    Icon(Icons.pets, size: 40, color: Colors.green.shade700),
                                  ],
                                ),
                              ),
                            ),
                            const SizedBox(height: 15),
                            ElevatedButton.icon(
                              onPressed: () {
                                if (sheepCount < 300) {
                                  setState(() {
                                    sheepCount++;
                                  });
                                }
                              },
                              icon: const Icon(Icons.add_a_photo, color: Colors.white),
                              label: Text(
                                isHindi ? 'फोटो खींचें और QR कोड बनाएं' : 'Take Photo & Generate QR',
                                style: const TextStyle(color: Colors.white, fontSize: 16),
                              ),
                              style: ElevatedButton.styleFrom(
                                backgroundColor: Colors.green.shade600,
                                padding: const EdgeInsets.symmetric(vertical: 14),
                              ),
                            ),
                            const SizedBox(height: 20),
                            Text(
                              isHindi ? 'सेव की गई भेड़ें:' : 'Saved Sheeps Profile:',
                              style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
                            ),
                            const SizedBox(height: 10),
                            sheepCount == 0
                                ? Padding(
                                    padding: const EdgeInsets.all(30.0),
                                    center: true,
                                    child: Text(
                                      isHindi ? 'अभी तक कोई भेड़ दर्ज नहीं हुई है।' : 'No sheep added yet.',
                                      textAlign: TextAlign.center,
                                    ),
                                  )
                                : GridView.builder(
                                    shrinkWrap: true,
                                    physics: const NeverScrollableScrollPhysics(),
                                    gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                                      crossAxisCount: 3,
                                      crossAxisSpacing: 8,
                                      mainAxisSpacing: 8,
                                    ),
                                    itemCount: sheepCount,
                                    itemBuilder: (context, index) {
                                      return Container(
                                        decoration: BoxDecoration(
                                          color: Colors.green.shade100,
                                          borderRadius: BorderRadius.circular(8),
                                        ),
                                        child: Column(
                                          mainAxisAlignment: MainAxisAlignment.center,
                                          children: [
                                            const Icon(Icons.pets, color: Colors.green),
                                            const SizedBox(height: 4),
                                            Text('#${index + 1}', style: const TextStyle(fontWeight: FontWeight.bold)),
                                          ],
                                        ),
                                      );
                                    },
                                  ),
                          ],
                        ),
                      )
                    : ListView(
                        padding: const EdgeInsets.all(16),
                        children: [
                          Text(
                            isHindi ? '💉 टीकाकरण समय सारणी' : '💉 Vaccination Schedule',
                            style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.green),
                          ),
                          const SizedBox(height: 8),
                          Card(
                            child: ListTile(
                              leading: const Icon(Icons.vaccines, color: Colors.blue),
                              title: Text(isHindi ? 'पीपीआर टीका (PPR Vaccine)' : 'PPR Vaccine'),
                              subtitle: Text(
                                isHindi
                                    ? 'कब लगाएं: 3 महीने की उम्र में\nफायदा: महामारी बुखार और दस्त से बचाव।'
                                    : 'At 3 months age. Prevents fever & diarrhea.',
                              ),
                            ),
                          ),
                          Card(
                            child: ListTile(
                              leading: const Icon(Icons.vaccines, color: Colors.red),
                              title: Text(isHindi ? 'खुरपका-मुँहपका टीका (FMD)' : 'FMD Vaccine'),
                              subtitle: Text(
                                isHindi
                                    ? 'कब लगाएं: साल में 2 बार\nफायदा: मुँह और खुर के छालों से बचाव।'
                                    : 'Twice a year. Prevents mouth/foot blisters.',
                              ),
                            ),
                          ),
                          const SizedBox(height: 20),
                          Text(
                            isHindi ? '🩺 सामान्य बीमारियां और दवाइयां' : '🩺 Common Diseases & Medicines',
                            style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.green),
                          ),
                          const SizedBox(height: 8),
                          Card(
                            child: ListTile(
                              leading: const Icon(Icons.medication, color: Colors.orange),
                              title: Text(isHindi ? 'पेट के कीड़े (Worms)' : 'Intestinal Worms'),
                              subtitle: Text(
                                isHindi ? 'दवा: Albendazole या Ivermectin' : 'Medicine: Albendazole / Ivermectin',
                              ),
                            ),
                          ),
                        ],
                      ),
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: selectedTab,
                  onTap: (index) {
                    setState(() {
                      selectedTab = index;
                    });
                  },
                  items: [
                    BottomNavigationBarItem(
                      icon: const Icon(Icons.pets),
                      label: isHindi ? 'भेड़ प्रोफाइल' : 'Sheep Profile',
                    ),
                    BottomNavigationBarItem(
                      icon: const Icon(Icons.medical_services),
                      label: isHindi ? 'दवा व टीके' : 'Medicine & Vaccines',
                    ),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
