name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --org com.example --project-name sheeps_app

      - name: Add Dependencies & Create Directories
        run: |
          flutter pub add image_picker qr_flutter flutter_launcher_icons --dev
          mkdir -p assets/icon

      - name: Set Custom Sheep App Icon
        run: |
          curl -sL "https://images.unsplash.com/photo-1516467508483-a7212febe31a?auto=format&fit=crop&w=512&q=80" -o assets/icon/icon.png

      - name: Configure App Launcher Icons in pubspec.yaml
        run: |
          echo "" >> pubspec.yaml
          echo "flutter_launcher_icons:" >> pubspec.yaml
          echo "  android: \"launcher_icon\"" >> pubspec.yaml
          echo "  ios: true" >> pubspec.yaml
          echo "  image_path: \"assets/icon/icon.png\"" >> pubspec.yaml

      - name: Overwrite main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:qr_flutter/qr_flutter.dart';

          void main() {
            runApp(const SheepsApp());
          }

          class SheepModel {
            final String id;
            final String name;
            final File photo;
            final String breed;
            final String age;
            final String gender;
            bool isChecked;
            bool isMissing;
            bool isSick;
            bool isPregnant;

            SheepModel({
              required this.id,
              required this.name,
              required this.photo,
              this.breed = 'मारवाड़ी (Marwari)',
              this.age = '18 महीने',
              this.gender = 'मादा (Female)',
              this.isChecked = true,
              this.isMissing = false,
              this.isSick = false,
              this.isPregnant = false,
            });
          }

          class SheepsApp extends StatelessWidget {
            const SheepsApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'AI Sheep Master',
                theme: ThemeData(
                  primarySwatch: Colors.green,
                  useMaterial3: true,
                ),
                home: const DashboardScreen(),
              );
            }
          }

          class DashboardScreen extends StatefulWidget {
            const DashboardScreen({super.key});

            @override
            State<DashboardScreen> createState() => _DashboardScreenState();
          }

          class _DashboardScreenState extends State<DashboardScreen> {
            int _currentIndex = 0;
            final List<SheepModel> sheepList = [];
            final ImagePicker _picker = ImagePicker();
            final int maxLimit = 300;

            Future<void> _addNewSheep() async {
              if (sheepList.length >= maxLimit) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('अधिकतम 300 भेड़ों की सीमा पूरी हो चुकी है!')),
                );
                return;
              }

              final XFile? photo = await _picker.pickImage(source: ImageSource.camera);
              if (photo != null) {
                int nextId = sheepList.length + 1;
                setState(() {
                  sheepList.add(
                    SheepModel(
                      id: 'SHEEP_QR_$nextId',
                      name: 'भेड़ #$nextId',
                      photo: File(photo.path),
                      isChecked: true,
                    ),
                  );
                });
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('नयी भेड़ सफलतापूर्वक जोड़ दी गई है!'), backgroundColor: Colors.green),
                );
              }
            }

            // Fully Automatic AI Scan & Status Update Logic
            void _autoScanAndVerify() async {
              final XFile? photo = await _picker.pickImage(source: ImageSource.camera);
              if (photo != null) {
                setState(() {
                  if (sheepList.isNotEmpty) {
                    var targetSheep = sheepList.firstWhere((s) => s.isMissing || !s.isChecked, orElse: () => sheepList.first);
                    targetSheep.isChecked = true;
                    targetSheep.isMissing = false;
                  }
                });
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text('Automatic Scan: भेड़ पहचान ली गई और उपस्थिति दर्ज हो गई!'),
                    backgroundColor: Colors.green,
                  ),
                );
              }
            }

            Widget _buildSummaryTab() {
              int totalSheep = sheepList.length;
              int sickCount = sheepList.where((s) => s.isSick).length;
              int pregnantCount = sheepList.where((s) => s.isPregnant).length;
              int missingCount = sheepList.where((s) => s.isMissing).length;

              return SingleChildScrollView(
                padding: const EdgeInsets.all(12.0),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    Card(
                      elevation: 3,
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                      child: Padding(
                        padding: const EdgeInsets.all(12.0),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            const Text('All herd data and summary at your hands', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.grey)),
                            Row(
                              children: [
                                IconButton(
                                  icon: const Icon(Icons.qr_code_scanner, color: Colors.blue),
                                  onPressed: _autoScanAndVerify,
                                  tooltip: 'Auto Scan',
                                ),
                                IconButton(
                                  icon: const Icon(Icons.add_a_photo, color: Colors.green),
                                  onPressed: _addNewSheep,
                                  tooltip: 'Add Sheep',
                                ),
                              ],
                            ),
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 10),

                    Container(
                      padding: const EdgeInsets.all(12),
                      decoration: BoxDecoration(
                        color: Colors.white,
                        borderRadius: BorderRadius.circular(12),
                        boxShadow: [BoxShadow(color: Colors.grey.shade300, blurRadius: 5)],
                      ),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text('Number of Sheep', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                          const Divider(),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              Text('All Sheep: $totalSheep / $maxLimit', style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                              const Icon(Icons.arrow_forward_ios, size: 16),
                            ],
                          ),
                          const SizedBox(height: 12),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                            children: [
                              _buildCountBox('Total', '$totalSheep', Colors.blue),
                              _buildCountBox('Missing', '$missingCount', Colors.red),
                              _buildCountBox('Active', '${totalSheep - missingCount}', Colors.green),
                            ],
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 15),

                    Container(
                      padding: const EdgeInsets.all(12),
                      decoration: BoxDecoration(
                        color: Colors.white,
                        borderRadius: BorderRadius.circular(12),
                        boxShadow: [BoxShadow(color: Colors.grey.shade300, blurRadius: 5)],
                      ),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text('Conditional Summary', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                          const Divider(),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                            children: [
                              _buildStatusBox('Sick', '$sickCount', Colors.red.shade400, Icons.medical_services),
                              _buildStatusBox('Pregnant', '$pregnantCount', Colors.purple.shade400, Icons.pregnant_woman),
                              _buildStatusBox('Healthy', '${totalSheep - sickCount}', Colors.teal.shade400, Icons.pets),
                            ],
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 15),

                    Container(
                      padding: const EdgeInsets.all(12),
                      decoration: BoxDecoration(
                        color: Colors.white,
                        borderRadius: BorderRadius.circular(12),
                        boxShadow: [BoxShadow(color: Colors.grey.shade300, blurRadius: 5)],
                      ),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text('Incomes / Expenses', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                          const Divider(),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceAround,
                            children: [
                              Column(
                                children: const [
                                  Text('Incomes', style: TextStyle(color: Colors.green, fontWeight: FontWeight.bold)),
                                  Text('₹ 0.00', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                                ],
                              ),
                              Container(height: 30, width: 1, color: Colors.grey),
                              Column(
                                children: const [
                                  Text('Expenses', style: TextStyle(color: Colors.red, fontWeight: FontWeight.bold)),
                                  Text('₹ 0.00', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                                ],
                              ),
                            ],
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _buildCountBox(String title, String count, Color color) {
              return Container(
                width: 100,
                padding: const EdgeInsets.all(10),
                decoration: BoxDecoration(
                  color: color,
                  borderRadius: BorderRadius.circular(8),
                ),
                child: Column(
                  children: [
                    Text(title, style: const TextStyle(color: Colors.white, fontSize: 12)),
                    const SizedBox(height: 5),
                    Text(count, style: const TextStyle(color: Colors.white, fontSize: 20, fontWeight: FontWeight.bold)),
                  ],
                ),
              );
            }

            Widget _buildStatusBox(String title, String count, Color color, IconData icon) {
              return Container(
                width: 105,
                padding: const EdgeInsets.all(10),
                decoration: BoxDecoration(
                  color: color,
                  borderRadius: BorderRadius.circular(8),
                ),
                child: Column(
                  children: [
                    Icon(icon, color: Colors.white, size: 20),
                    const SizedBox(height: 4),
                    Text(title, style: const TextStyle(color: Colors.white, fontSize: 12)),
                    const SizedBox(height: 5),
                    Text(count, style: const TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.bold)),
                  ],
                ),
              );
            }

            Widget _buildCattleTab() {
              return sheepList.isEmpty
                  ? const Center(child: Text('कोई भेड़ दर्ज नहीं है। ऊपर दिए गए कैमरे से जोड़ें।'))
                  : GridView.builder(
                      padding: const EdgeInsets.all(12),
                      gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                        crossAxisCount: 2,
                        crossAxisSpacing: 10,
                        mainAxisSpacing: 10,
                        childAspectRatio: 0.8,
                      ),
                      itemCount: sheepList.length,
                      itemBuilder: (context, index) {
                        final sheep = sheepList[index];
                        return Card(
                          elevation: 3,
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.stretch,
                            children: [
                              Expanded(
                                child: Stack(
                                  children: [
                                    Image.file(sheep.photo, fit: BoxFit.cover, width: double.infinity, height: double.infinity),
                                    if (sheep.isChecked)
                                      const Positioned(
                                        top: 8,
                                        right: 8,
                                        child: CircleAvatar(
                                          radius: 12,
                                          backgroundColor: Colors.green,
                                          child: Icon(Icons.check, color: Colors.white, size: 16),
                                        ),
                                      ),
                                    if (sheep.isMissing)
                                      const Positioned(
                                        top: 8,
                                        right: 8,
                                        child: CircleAvatar(
                                          radius: 12,
                                          backgroundColor: Colors.red,
                                          child: Icon(Icons.close, color: Colors.white, size: 16),
                                        ),
                                      ),
                                  ],
                                ),
                              ),
                              Padding(
                                padding: const EdgeInsets.all(8.0),
                                child: Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    Text(sheep.name, style: const TextStyle(fontWeight: FontWeight.bold)),
                                    Text('ID: ${sheep.id}', style: const TextStyle(fontSize: 10, color: Colors.grey)),
                                  ],
                                ),
                              ),
                            ],
                          ),
                        );
                      },
                    );
            }

            Widget _buildNotificationsTab() {
              return ListView(
                padding: const EdgeInsets.all(12),
                children: const [
                  ListTile(
                    leading: Icon(Icons.vaccines, color: Colors.blue),
                    title: Text('टीकाकरण अलर्ट (PPR & FMD)'),
                    subtitle: Text('सालाना शेड्यूल के अनुसार समय पर टीके लगवाएं।'),
                  ),
                  Divider(),
                  ListTile(
                    leading: Icon(Icons.warning, color: Colors.orange),
                    title: Text('स्वास्थ्य एवं Deworming'),
                    subtitle: Text('हर 3 महीने में पेट के कीड़े की दवा अवश्य दें।'),
                  ),
                ],
              );
            }

            Widget _buildReportsTab() {
              return Padding(
                padding: const EdgeInsets.all(16.0),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    const Text('हेर्ड स्वास्थ्य रिपोर्ट (Health Reports)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 15),
                    Card(
                      child: ListTile(
                        title: const Text('कुल दर्ज भेड़ें'),
                        trailing: Text('${sheepList.length} / $maxLimit', style: const TextStyle(fontWeight: FontWeight.bold)),
                      ),
                    ),
                    Card(
                      child: ListTile(
                        title: const Text('उपस्थित (Verified)'),
                        trailing: Text('${sheepList.where((s) => s.isChecked).length}', style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.green)),
                      ),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final List<Widget> pages = [
                _buildSummaryTab(),
                _buildCattleTab(),
                _buildNotificationsTab(),
                _buildReportsTab(),
              ];

              return Scaffold(
                appBar: AppBar(
                  title: const Text('AI Sheep Master', style: TextStyle(color: Colors.white)),
                  backgroundColor: Colors.teal.shade700,
                  centerTitle: true,
                ),
                body: pages[_currentIndex],
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _currentIndex,
                  type: BottomNavigationBarType.fixed,
                  selectedItemColor: Colors.teal.shade700,
                  unselectedItemColor: Colors.grey,
                  onTap: (index) {
                    setState(() {
                      _currentIndex = index;
                    });
                  },
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.home), label: 'Summary'),
                    BottomNavigationBarItem(icon: Icon(Icons.pets), label: 'Cattle'),
                    BottomNavigationBarItem(icon: Icon(Icons.notifications), label: 'Notifications'),
                    BottomNavigationBarItem(icon: Icon(Icons.bar_chart), label: 'Reports'),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Generate App Launcher Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons:generate || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Build APK
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
