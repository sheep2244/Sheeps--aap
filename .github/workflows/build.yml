name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --org com.example --project-name sheeps_app

      - name: Add Dependencies
        run: |
          flutter pub add image_picker qr_flutter

      - name: Overwrite main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:qr_flutter/qr_flutter.dart';

          void main() {
            runApp(const SheepsApp());
          }

          class SheepModel {
            final String id;
            final String name;
            final File photo;
            final String breed;
            final String age;
            final String gender;
            bool isChecked; // Scan hone par hari tick ke liye
            bool isMissing; // Gum hone par lal nishan ke liye

            SheepModel({
              required this.id,
              required this.name,
              required this.photo,
              this.breed = 'Marwari (मारवाड़ी)',
              this.age = '18 Months',
              this.gender = 'मादा (Female)',
              this.isChecked = false,
              this.isMissing = false,
            });
          }

          class SheepsApp extends StatelessWidget {
            const SheepsApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'AI Sheep Tracker & Health Care',
                theme: ThemeData(
                  primarySwatch: Colors.green,
                  useMaterial3: true,
                ),
                home: const SheepDashboard(),
              );
            }
          }

          class SheepDashboard extends StatefulWidget {
            const SheepDashboard({super.key});

            @override
            State<SheepDashboard> createState() => _SheepDashboardState();
          }

          class _SheepDashboardState extends State<SheepDashboard> {
            final List<SheepModel> sheepList = [];
            final int maxLimit = 300;
            final ImagePicker _picker = ImagePicker();
            int selectedTab = 0;

            Future<void> _captureSheepPhoto() async {
              if (sheepList.length >= maxLimit) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Maximum limit of 300 sheeps reached!')),
                );
                return;
              }

              final XFile? photo = await _picker.pickImage(source: ImageSource.camera);
              if (photo != null) {
                int nextId = sheepList.length + 1;
                setState(() {
                  sheepList.add(
                    SheepModel(
                      id: 'SHEEP_QR_$nextId',
                      name: 'Bhed #$nextId',
                      photo: File(photo.path),
                    ),
                  );
                });
              }
            }

            void _toggleStatus(SheepModel sheep, bool? checked, bool? missing) {
              setState(() {
                if (checked != null) sheep.isChecked = checked;
                if (missing != null) sheep.isMissing = missing;
              });
            }

            void _showSheepDetails(SheepModel sheep) {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: Colors.transparent,
                builder: (context) {
                  return StatefulBuilder(
                    builder: (context, setModalState) {
                      return Container(
                        decoration: const BoxDecoration(
                          color: Color(0xFFE8F5E9),
                          borderRadius: BorderRadius.vertical(top: Radius.circular(25)),
                        ),
                        padding: const EdgeInsets.all(20.0),
                        child: SingleChildScrollView(
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              Container(
                                width: 40,
                                height: 4,
                                decoration: BoxDecoration(
                                  color: Colors.green.shade300,
                                  borderRadius: BorderRadius.circular(2),
                                ),
                              ),
                              const SizedBox(height: 15),
                              Container(
                                padding: const EdgeInsets.all(16),
                                decoration: BoxDecoration(
                                  color: Colors.white,
                                  borderRadius: BorderRadius.circular(20),
                                  boxShadow: [
                                    BoxShadow(
                                      color: Colors.green.withOpacity(0.2),
                                      blurRadius: 10,
                                      spreadRadius: 2,
                                    )
                                  ],
                                ),
                                child: Column(
                                  children: [
                                    const Text(
                                      'sheeps_app Digital ID',
                                      style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.green),
                                    ),
                                    const SizedBox(height: 12),
                                    Stack(
                                      alignment: Alignment.topRight,
                                      children: [
                                        ClipOval(
                                          child: Image.file(
                                            sheep.photo,
                                            height: 130,
                                            width: 130,
                                            fit: BoxFit.cover,
                                          ),
                                        ),
                                        if (sheep.isChecked)
                                          const CircleAvatar(
                                            radius: 16,
                                            backgroundColor: Colors.green,
                                            child: Icon(Icons.check, color: Colors.white, size: 20),
                                          ),
                                        if (sheep.isMissing)
                                          const CircleAvatar(
                                            radius: 16,
                                            backgroundColor: Colors.red,
                                            child: Icon(Icons.close, color: Colors.white, size: 20),
                                          ),
                                      ],
                                    ),
                                    const SizedBox(height: 12),
                                    Text(
                                      sheep.name,
                                      style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Colors.black87),
                                    ),
                                    const Divider(height: 25),
                                    Row(
                                      mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                      children: [
                                        Column(
                                          crossAxisAlignment: CrossAxisAlignment.start,
                                          children: [
                                            Text('ID: ${sheep.id}', style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.grey)),
                                            const SizedBox(height: 6),
                                            Text('नस्ल / Breed: ${sheep.breed}', style: const TextStyle(fontSize: 14)),
                                            const SizedBox(height: 6),
                                            Text('उम्र / Age: ${sheep.age}', style: const TextStyle(fontSize: 14)),
                                          ],
                                        ),
                                        QrImageView(
                                          data: sheep.id,
                                          version: QrVersions.auto,
                                          size: 80.0,
                                        ),
                                      ],
                                    ),
                                    const SizedBox(height: 15),
                                    // Status toggle buttons for checking/missing
                                    Row(
                                      mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                                      children: [
                                        ElevatedButton.icon(
                                          onPressed: () {
                                            setModalState(() {
                                              sheep.isChecked = !sheep.isChecked;
                                              if (sheep.isChecked) sheep.isMissing = false;
                                            });
                                            _toggleStatus(sheep, sheep.isChecked, null);
                                          },
                                          icon: Icon(Icons.check_circle, color: sheep.isChecked ? Colors.white : Colors.green),
                                          label: Text(sheep.isChecked ? 'Verified (मिल गई)' : 'Mark Found'),
                                          style: ElevatedButton.styleFrom(
                                            backgroundColor: sheep.isChecked ? Colors.green : Colors.white,
                                            foregroundColor: sheep.isChecked ? Colors.white : Colors.green,
                                          ),
                                        ),
                                        ElevatedButton.icon(
                                          onPressed: () {
                                            setModalState(() {
                                              sheep.isMissing = !sheep.isMissing;
                                              if (sheep.isMissing) sheep.isChecked = false;
                                            });
                                            _toggleStatus(sheep, null, sheep.isMissing);
                                          },
                                          icon: Icon(Icons.warning, color: sheep.isMissing ? Colors.white : Colors.red),
                                          label: Text(sheep.isMissing ? 'Missing (खोई)' : 'Mark Missing'),
                                          style: ElevatedButton.styleFrom(
                                            backgroundColor: sheep.isMissing ? Colors.red : Colors.white,
                                            foregroundColor: sheep.isMissing ? Colors.white : Colors.red,
                                          ),
                                        ),
                                      ],
                                    ),
                                  ],
                                ),
                              ),
                              const SizedBox(height: 20),
                            ],
                          ),
                        ),
                      );
                    },
                  );
                },
              );
            }

            Widget _buildTrackerTab() {
              return SingleChildScrollView(
                padding: const EdgeInsets.all(16.0),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    Card(
                      elevation: 4,
                      color: Colors.green.shade50,
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                      child: Padding(
                        padding: const EdgeInsets.all(16.0),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                const Text('Total Registered Sheeps', style: TextStyle(fontSize: 14)),
                                Text('${sheepList.length} / $maxLimit', style: TextStyle(fontSize: 30, fontWeight: FontWeight.bold, color: Colors.green.shade800)),
                              ],
                            ),
                            Icon(Icons.pets, size: 44, color: Colors.green.shade700),
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 15),
                    ElevatedButton.icon(
                      onPressed: _captureSheepPhoto,
                      icon: const Icon(Icons.add_a_photo, color: Colors.white),
                      label: const Text('Take Photo & Generate QR Code', style: TextStyle(fontSize: 16, color: Colors.white)),
                      style: ElevatedButton.styleFrom(
                        backgroundColor: Colors.green.shade600,
                        padding: const EdgeInsets.symmetric(vertical: 14),
                      ),
                    ),
                    const SizedBox(height: 20),
                    const Text('Saved Sheep Profiles (Green = Found, Red = Missing):', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 10),
                    sheepList.isEmpty
                        ? const Center(child: Padding(padding: EdgeInsets.all(20), child: Text('No sheep registered yet.')))
                        : GridView.builder(
                            shrinkWrap: true,
                            physics: const NeverScrollableScrollPhysics(),
                            gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                              crossAxisCount: 3,
                              crossAxisSpacing: 8,
                              mainAxisSpacing: 8,
                            ),
                            itemCount: sheepList.length,
                            itemBuilder: (context, index) {
                              final sheep = sheepList[index];
                              return GestureDetector(
                                onTap: () => _showSheepDetails(sheep),
                                child: Stack(
                                  children: [
                                    ClipRRect(
                                      borderRadius: BorderRadius.circular(8),
                                      child: Image.file(sheep.photo, width: double.infinity, height: double.infinity, fit: BoxFit.cover),
                                    ),
                                    // Status Badge on Grid Image
                                    if (sheep.isChecked)
                                      Positioned(
                                        top: 4,
                                        right: 4,
                                        child: Container(
                                          padding: const EdgeInsets.all(2),
                                          decoration: const BoxDecoration(color: Colors.green, shape: BoxShape.circle),
                                          child: const Icon(Icons.check, color: Colors.white, size: 14),
                                        ),
                                      ),
                                    if (sheep.isMissing)
                                      Positioned(
                                        top: 4,
                                        right: 4,
                                        child: Container(
                                          padding: const EdgeInsets.all(2),
                                          decoration: const BoxDecoration(color: Colors.red, shape: BoxShape.circle),
                                          child: const Icon(Icons.close, color: Colors.white, size: 14),
                                        ),
                                      ),
                                    Positioned(
                                      bottom: 4,
                                      left: 4,
                                      child: Container(
                                        color: Colors.black54,
                                        padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 2),
                                        child: Text(sheep.name, style: const TextStyle(color: Colors.white, fontSize: 11)),
                                      ),
                                    ),
                                  ],
                                ),
                              );
                            },
                          ),
                  ],
                ),
              );
            }

            Widget _buildMedicineGuideTab() {
              return ListView(
                padding: const EdgeInsets.all(16),
                children: const [
                  Text('💉 Vaccination Schedule (टीकाकरण समय सारणी)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.green)),
                  SizedBox(height: 8),
                  Card(
                    child: ListTile(
                      leading: Icon(Icons.vaccines, color: Colors.blue),
                      title: Text('PPR Vaccine (पीपीआर का टीका)'),
                      subtitle: Text('कब लगाएं: 3 महीने की उम्र में (हर 3 साल में एक बार)\nफायदा: महामारी बुखार और दस्त से बचाव।'),
                    ),
                  ),
                  Card(
                    child: ListTile(
                      leading: Icon(Icons.vaccines, color: Colors.red),
                      title: Text('FMD Vaccine (खुरपका-मुँहपका)'),
                      subtitle: Text('कब लगाएं: साल में 2 बार (मई-जून और नवंबर-दिसंबर)\nफायदा: मुँह और खुर के छालों से बचाव।'),
                    ),
                  ),
                ],
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('AI Sheep Tracker & Health Care', style: TextStyle(color: Colors.white)),
                  backgroundColor: Colors.green.shade700,
                  centerTitle: true,
                ),
                body: selectedTab == 0 ? _buildTrackerTab() : _buildMedicineGuideTab(),
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: selectedTab,
                  onTap: (index) {
                    setState(() {
                      selectedTab = index;
                    });
                  },
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.pets), label: 'Sheep Profiles'),
                    BottomNavigationBarItem(icon: Icon(Icons.medical_services), label: 'Medicine & Vaccines'),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
