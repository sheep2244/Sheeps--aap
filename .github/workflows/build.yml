name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --org com.example --project-name sheep_master

      - name: Add Dependencies
        run: |
          flutter pub add image_picker http geolocator geocoding

      - name: Overwrite main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:http/http.dart' as http;
          import 'package:geolocator/geolocator.dart';

          void main() {
            runApp(const SheepMasterApp());
          }

          class SheepModel {
            final String id;
            String name;
            final String photoUrl;
            bool isMissing;
            String location;
            String healthNotes;

            SheepModel({
              required this.id,
              required this.name,
              required this.photoUrl,
              this.isMissing = false,
              this.location = 'Unknown Location',
              this.healthNotes = 'Normal',
            });

            factory SheepModel.fromJson(String id, Map<String, dynamic> json) {
              return SheepModel(
                id: id,
                name: json['name'] ?? 'Bhed',
                photoUrl: json['photoUrl'] ?? '',
                isMissing: json['isMissing'] ?? false,
                location: json['location'] ?? 'Unknown Location',
                healthNotes: json['healthNotes'] ?? 'Normal',
              );
            }
          }

          class SheepMasterApp extends StatelessWidget {
            const SheepMasterApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'AI Sheep Master Pro',
                theme: ThemeData(
                  primarySwatch: Colors.teal,
                  useMaterial3: true,
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            final List<SheepModel> sheepList = [];
            List<SheepModel> filteredSheepList = [];
            final ImagePicker _picker = ImagePicker();
            bool isLoading = false;
            TextEditingController searchController = TextEditingController();

            final String firebaseUrl = "https://sheep-master-default-rtdb.firebaseio.com/sheep.json";

            @override
            void initState() {
              super.initState();
              _fetchOnlineData();
              searchController.addListener(_filterSheep);
            }

            @override
            void dispose() {
              searchController.dispose();
              super.dispose();
            }

            void _filterSheep() {
              String query = searchController.text.toLowerCase();
              setState(() {
                if (query.isEmpty) {
                  filteredSheepList = sheepList;
                } else {
                  filteredSheepList = sheepList.where((sheep) {
                    return sheep.name.toLowerCase().contains(query) ||
                           sheep.location.toLowerCase().contains(query) ||
                           sheep.healthNotes.toLowerCase().contains(query);
                  }).toList();
                }
              });
            }

            Future<void> _fetchOnlineData() async {
              setState(() => isLoading = true);
              try {
                final response = await http.get(Uri.parse(firebaseUrl));
                if (response.statusCode == 200 && response.body != 'null') {
                  final Map<String, dynamic> data = json.decode(response.body);
                  List<SheepModel> loadedSheep = [];
                  data.forEach((key, value) {
                    loadedSheep.add(SheepModel.fromJson(key, value));
                  });
                  setState(() {
                    sheepList.clear();
                    sheepList.addAll(loadedSheep);
                    filteredSheepList = sheepList;
                  });
                }
              } catch (e) {
                // Fallback
              } finally {
                setState(() => isLoading = false);
              }
            }

            // Feature 1: GPS Location Fetcher
            Future<String> _getCurrentLocation() async {
              bool serviceEnabled;
              LocationPermission permission;

              serviceEnabled = await Geolocator.isLocationServiceEnabled();
              if (!serviceEnabled) return 'Location Disabled';

              permission = await Geolocator.checkPermission();
              if (permission == LocationPermission.denied) {
                permission = await Geolocator.requestPermission();
                if (permission == LocationPermission.denied) return 'Permission Denied';
              }

              if (permission == LocationPermission.deniedForever) return 'Permission Permanently Denied';

              Position position = await Geolocator.getCurrentPosition(desiredAccuracy: LocationAccuracy.high);
              return 'Lat: ${position.latitude.toStringAsFixed(2)}, Lng: ${position.longitude.toStringAsFixed(2)}';
            }

            Future<void> _addNewSheep() async {
              final XFile? photo = await _picker.pickImage(source: ImageSource.camera, imageQuality: 50);
              if (photo != null) {
                setState(() => isLoading = true);
                int nextId = sheepList.length + 1;
                
                // Get Location automatically
                String loc = await _getCurrentLocation();

                List<int> imageBytes = await File(photo.path).readAsBytes();
                String base64Image = base64Encode(imageBytes);
                String dataUrl = "data:image/jpeg;base64,$base64Image";

                Map<String, dynamic> newSheepData = {
                  'name': 'Bhed #$nextId',
                  'photoUrl': dataUrl,
                  'isMissing': false,
                  'location': loc,
                  'healthNotes': 'Fully Vaccinated',
                  'timestamp': DateTime.now().toIso8601String(),
                };

                try {
                  final response = await http.post(
                    Uri.parse(firebaseUrl),
                    body: json.encode(newSheepData),
                  );
                  if (response.statusCode == 200) {
                    final responseData = json.decode(response.body);
                    String generatedId = responseData['name'];
                    setState(() {
                      SheepModel newSheep = SheepModel.fromJson(generatedId, newSheepData);
                      sheepList.add(newSheep);
                      filteredSheepList = sheepList;
                    });
                    if (mounted) {
                      ScaffoldMessenger.of(context).showSnackBar(
                        const SnackBar(content: Text('GPS Location aur Photo ke sath Bhed jodi gayi!'), backgroundColor: Colors.teal),
                      );
                    }
                  }
                } catch (e) {
                  if (mounted) {
                    ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Internet Connection Error!')));
                  }
                } finally {
                  setState(() => isLoading = false);
                }
              }
            }

            Future<void> _toggleMissingStatus(SheepModel sheep) async {
              bool updatedStatus = !sheep.isMissing;
              setState(() {
                sheep.isMissing = updatedStatus;
              });

              String updateUrl = "https://sheep-master-default-rtdb.firebaseio.com/sheep/${sheep.id}.json";
              try {
                await http.patch(Uri.parse(updateUrl), body: json.encode({'isMissing': updatedStatus}));
              } catch (e) {}
            }

            // Feature 3: Update Health Notes Dialog
            void _editHealthNotes(SheepModel sheep) {
              TextEditingController noteController = TextEditingController(text: sheep.healthNotes);
              showDialog(
                context: context,
                builder: (context) => AlertDialog(
                  title: Text('${sheep.name} ka Health / Vaccine Note'),
                  content: TextField(
                    controller: noteController,
                    decoration: const InputDecoration(hintText: 'Jaise: Vaccination ho gaya, Dawai di'),
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(context), child: const Text('Cancel')),
                    ElevatedButton(
                      onPressed: () async {
                        setState(() {
                          sheep.healthNotes = noteController.text;
                        });
                        Navigator.pop(context);
                        String updateUrl = "https://sheep-master-default-rtdb.firebaseio.com/sheep/${sheep.id}.json";
                        await http.patch(Uri.parse(updateUrl), body: json.encode({'healthNotes': sheep.healthNotes}));
                      },
                      child: const Text('Save'),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              int totalSheep = sheepList.length;
              int missingSheep = sheepList.where((s) => s.isMissing).length;
              int activeSheep = totalSheep - missingSheep;

              return Scaffold(
                appBar: AppBar(
                  title: const Text('AI Sheep Master Pro', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                  backgroundColor: Colors.teal.shade700,
                  centerTitle: true,
                  actions: [
                    IconButton(icon: const Icon(Icons.refresh, color: Colors.white), onPressed: _fetchOnlineData)
                  ],
                ),
                body: isLoading
                    ? const Center(child: CircularProgressIndicator(color: Colors.teal))
                    : Column(
                        children: [
                          // Summary Card
                          Container(
                            margin: const EdgeInsets.all(12),
                            padding: const EdgeInsets.all(16),
                            decoration: BoxDecoration(
                              color: Colors.teal.shade50,
                              borderRadius: BorderRadius.circular(12),
                              border: Border.all(color: Colors.teal.shade200),
                            ),
                            child: Row(
                              mainAxisAlignment: MainAxisAlignment.spaceAround,
                              children: [
                                _buildCountCard('Kul Bhed', '$totalSheep', Colors.blue),
                                _buildCountCard('Surakshit', '$activeSheep', Colors.green),
                                _buildCountCard('Gumshuda', '$missingSheep', Colors.red),
                              ],
                            ),
                          ),

                          // Feature 2: Search Box
                          Padding(
                            padding: const EdgeInsets.symmetric(horizontal: 12.0),
                            child: TextField(
                              controller: searchController,
                              decoration: InputDecoration(
                                hintText: 'Bhed ka naam ya location khojein...',
                                prefixIcon: const Icon(Icons.search, color: Colors.teal),
                                filled: true,
                                fillColor: Colors.grey.shade100,
                                border: OutlineInputBorder(borderRadius: BorderRadius.circular(10), borderSide: BorderSide.none),
                              ),
                            ),
                          ),
                          const SizedBox(height: 10),

                          // List / Grid
                          Expanded(
                            child: filteredSheepList.isEmpty
                                ? const Center(child: Text('Koi bhed nahi mili!', style: TextStyle(color: Colors.grey, fontSize: 16)))
                                : GridView.builder(
                                    padding: const EdgeInsets.all(12),
                                    gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                                      crossAxisCount: 2,
                                      crossAxisSpacing: 10,
                                      mainAxisSpacing: 10,
                                      childAspectRatio: 0.65,
                                    ),
                                    itemCount: filteredSheepList.length,
                                    itemBuilder: (context, index) {
                                      final sheep = filteredSheepList[index];
                                      return Card(
                                        elevation: 3,
                                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                                        child: Column(
                                          crossAxisAlignment: CrossAxisAlignment.stretch,
                                          children: [
                                            Expanded(
                                              child: ClipRRect(
                                                borderRadius: const BorderRadius.vertical(top: Radius.circular(12)),
                                                child: sheep.photoUrl.startsWith('data:image')
                                                    ? Image.memory(base64Decode(sheep.photoUrl.split(',').last), fit: BoxFit.cover)
                                                    : Container(color: Colors.teal.shade100, child: const Icon(Icons.pets, size: 40)),
                                              ),
                                            ),
                                            Padding(
                                              padding: const EdgeInsets.all(6.0),
                                              child: Column(
                                                crossAxisAlignment: CrossAxisAlignment.start,
                                                children: [
                                                  Text(sheep.name, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13)),
                                                  const SizedBox(height: 2),
                                                  Row(
                                                    children: [
                                                      const Icon(Icons.location_on, size: 12, color: Colors.red),
                                                      const SizedBox(width: 2),
                                                      Expanded(child: Text(sheep.location, style: const TextStyle(fontSize: 10, color: Colors.grey), overflow: TextOverflow.ellipsis)),
                                                    ],
                                                  ),
                                                  const SizedBox(height: 2),
                                                  GestureDetector(
                                                    onTap: () => _editHealthNotes(sheep),
                                                    child: Text('Note: ${sheep.healthNotes}', style: const TextStyle(fontSize: 10, color: Colors.blue, fontWeight: FontWeight.w500), overflow: TextOverflow.ellipsis),
                                                  ),
                                                  const SizedBox(height: 4),
                                                  InkWell(
                                                    onTap: () => _toggleMissingStatus(sheep),
                                                    child: Container(
                                                      alignment: Alignment.center,
                                                      padding: const EdgeInsets.symmetric(vertical: 4),
                                                      decoration: BoxDecoration(
                                                        color: sheep.isMissing ? Colors.red.shade100 : Colors.green.shade100,
                                                        borderRadius: BorderRadius.circular(6),
                                                      ),
                                                      child: Text(
                                                        sheep.isMissing ? 'Missing' : 'Safe',
                                                        style: TextStyle(color: sheep.isMissing ? Colors.red.shade800 : Colors.green.shade800, fontSize: 11, fontWeight: FontWeight.bold),
                                                      ),
                                                    ),
                                                  ),
                                                ],
                                              ),
                                            ),
                                          ],
                                        ),
                                      );
                                    },
                                  ),
                          ),
                        ],
                      ),
                floatingActionButton: FloatingActionButton.extended(
                  onPressed: _addNewSheep,
                  backgroundColor: Colors.teal,
                  icon: const Icon(Icons.add_a_photo, color: Colors.white),
                  label: const Text('GPS ke sath Jodein', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                ),
              );
            }

            Widget _buildCountCard(String title, String count, Color color) {
              return Column(
                children: [
                  Text(title, style: const TextStyle(fontSize: 12, fontWeight: FontWeight.w500)),
                  const SizedBox(height: 4),
                  Text(count, style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: color)),
                ],
              );
            }
          }
          EOF

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SheepMaster-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
