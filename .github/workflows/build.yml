name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --org com.example --project-name sheep_master

      - name: Update Kotlin Version in build.gradle
        run: |
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.24'/" android/build.gradle || true

      - name: Add Dependencies
        run: |
          flutter pub add image_picker http geolocator geocoding

      - name: Overwrite main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:http/http.dart' as http;
          import 'package:geolocator/geolocator.dart';

          void main() {
            runApp(const SheepMasterApp());
          }

          class SheepModel {
            final String id;
            final String tagNumber;
            final String photoUrl;
            bool isMissing;
            String location;

            SheepModel({
              required this.id,
              required this.tagNumber,
              required this.photoUrl,
              this.isMissing = false,
              this.location = 'Location Unknown',
            });

            factory SheepModel.fromJson(String id, Map<String, dynamic> json) {
              return SheepModel(
                id: id,
                tagNumber: json['tagNumber'] ?? 'No Tag',
                photoUrl: json['photoUrl'] ?? '',
                isMissing: json['isMissing'] ?? false,
                location: json['location'] ?? 'Location Unknown',
              );
            }
          }

          class SheepMasterApp extends StatelessWidget {
            const SheepMasterApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'AI Sheep Master Pro',
                theme: ThemeData(
                  primarySwatch: Colors.teal,
                  useMaterial3: true,
                ),
                home: const AuthScreen(),
              );
            }
          }

          // 1. MULTI-USER LOGIN & REGISTER SCREEN
          class AuthScreen extends StatefulWidget {
            const AuthScreen({super.key});

            @override
            State<AuthScreen> createState() => _AuthScreenState();
          }

          class _AuthScreenState extends State<AuthScreen> {
            final TextEditingController _phoneController = TextEditingController();
            final TextEditingController _pinController = TextEditingController();
            bool isLoginMode = true;
            bool isLoading = false;

            final String baseUrl = "https://sheep-master-default-rtdb.firebaseio.com/users";

            Future<void> _submitAuth() async {
              String phone = _phoneController.text.trim();
              String pin = _pinController.text.trim();

              if (phone.length < 10 || pin.length < 4) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('10-digit Mobile Number aur 4-digit PIN dalein!'), backgroundColor: Colors.red),
                );
                return;
              }

              setState(() => isLoading = true);
              String userUrl = "$baseUrl/$phone.json";

              try {
                final response = await http.get(Uri.parse(userUrl));
                final userData = json.decode(response.body);

                if (isLoginMode) {
                  // Login Check
                  if (userData != null && userData['pin'] == pin) {
                    if (mounted) {
                      Navigator.pushReplacement(
                        context,
                        MaterialPageRoute(builder: (context) => HomeScreen(userPhone: phone)),
                      );
                    }
                  } else {
                    if (mounted) {
                      ScaffoldMessenger.of(context).showSnackBar(
                        const SnackBar(content: Text('Galat Mobile Number ya PIN! Pehle Naya Account banayein.'), backgroundColor: Colors.red),
                      );
                    }
                  }
                } else {
                  // Register New User
                  if (userData != null) {
                    if (mounted) {
                      ScaffoldMessenger.of(context).showSnackBar(
                        const SnackBar(content: Text('Ye Mobile Number pehle se registered hai! Login karein.'), backgroundColor: Colors.orange),
                      );
                    }
                  } else {
                    await http.put(Uri.parse(userUrl), body: json.encode({'pin': pin, 'createdAt': DateTime.now().toIso8601String()}));
                    if (mounted) {
                      ScaffoldMessenger.of(context).showSnackBar(
                        const SnackBar(content: Text('Account ban gaya! Swagat hai.'), backgroundColor: Colors.green),
                      );
                      Navigator.pushReplacement(
                        context,
                        MaterialPageRoute(builder: (context) => HomeScreen(userPhone: phone)),
                      );
                    }
                  }
                }
              } catch (e) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('Internet Connection Check Karein!')),
                  );
                }
              } finally {
                if (mounted) setState(() => isLoading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.teal.shade50,
                body: Center(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(24.0),
                    child: Card(
                      elevation: 5,
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                      child: Padding(
                        padding: const EdgeInsets.all(24.0),
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            const Icon(Icons.pets, size: 64, color: Colors.teal),
                            const SizedBox(height: 10),
                            Text(
                              isLoginMode ? 'Farmer Login' : 'Naya Account Banayein',
                              style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Colors.teal),
                            ),
                            const SizedBox(height: 20),
                            TextField(
                              controller: _phoneController,
                              keyboardType: TextInputType.phone,
                              maxLength: 10,
                              decoration: const InputDecoration(
                                labelText: 'Mobile Number',
                                prefixIcon: Icon(Icons.phone),
                                border: OutlineInputBorder(),
                                counterText: '',
                              ),
                            ),
                            const SizedBox(height: 14),
                            TextField(
                              controller: _pinController,
                              keyboardType: TextInputType.number,
                              obscureText: true,
                              maxLength: 4,
                              decoration: const InputDecoration(
                                labelText: '4-Digit Secret PIN',
                                prefixIcon: Icon(Icons.lock),
                                border: OutlineInputBorder(),
                                counterText: '',
                              ),
                            ),
                            const SizedBox(height: 20),
                            isLoading
                                ? const CircularProgressIndicator(color: Colors.teal)
                                : ElevatedButton(
                                    style: ElevatedButton.styleFrom(backgroundColor: Colors.teal, minimumSize: const Size.fromHeight(50)),
                                    onPressed: _submitAuth,
                                    child: Text(
                                      isLoginMode ? 'Login Karein' : 'Register Karein',
                                      style: const TextStyle(color: Colors.white, fontSize: 16, fontWeight: FontWeight.bold),
                                    ),
                                  ),
                            const SizedBox(height: 12),
                            TextButton(
                              onPressed: () => setState(() => isLoginMode = !isLoginMode),
                              child: Text(
                                isLoginMode ? 'Naya User? Yahan Account Banayein' : 'Pehle se Account hai? Login Karein',
                                style: const TextStyle(color: Colors.teal, fontWeight: FontWeight.bold),
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          // HOME SCREEN (User-Specific Data + Ear Tag + GPS + Counting)
          class HomeScreen extends StatefulWidget {
            final String userPhone;
            const HomeScreen({super.key, required this.userPhone});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            final List<SheepModel> sheepList = [];
            final ImagePicker _picker = ImagePicker();
            bool isLoading = false;

            // User-specific isolated database path
            String get userSheepUrl => "https://sheep-master-default-rtdb.firebaseio.com/users/${widget.userPhone}/sheep.json";

            @override
            void initState() {
              super.initState();
              _fetchOnlineData();
            }

            Future<void> _fetchOnlineData() async {
              setState(() => isLoading = true);
              try {
                final response = await http.get(Uri.parse(userSheepUrl));
                if (response.statusCode == 200 && response.body != 'null') {
                  final Map<String, dynamic> data = json.decode(response.body);
                  List<SheepModel> loadedSheep = [];
                  data.forEach((key, value) {
                    loadedSheep.add(SheepModel.fromJson(key, value));
                  });
                  setState(() {
                    sheepList.clear();
                    sheepList.addAll(loadedSheep);
                  });
                }
              } catch (e) {
                // Fallback
              } finally {
                setState(() => isLoading = false);
              }
            }

            Future<String> _getGpsLocation() async {
              bool serviceEnabled = await Geolocator.isLocationServiceEnabled();
              if (!serviceEnabled) return 'GPS Off';

              LocationPermission permission = await Geolocator.checkPermission();
              if (permission == LocationPermission.denied) {
                permission = await Geolocator.requestPermission();
                if (permission == LocationPermission.denied) return 'No Permission';
              }

              Position pos = await Geolocator.getCurrentPosition(desiredAccuracy: LocationAccuracy.high);
              return '${pos.latitude.toStringAsFixed(4)}, ${pos.longitude.toStringAsFixed(4)}';
            }

            // 2. PHOTO + EAR TAG INPUT DIALOG
            Future<void> _addNewSheep() async {
              final XFile? photo = await _picker.pickImage(source: ImageSource.camera, imageQuality: 45);
              if (photo == null) return;

              TextEditingController tagController = TextEditingController(text: 'Tag #${sheepList.length + 1}');

              if (!mounted) return;
              bool? confirm = await showDialog<bool>(
                context: context,
                barrierDismissible: false,
                builder: (ctx) => AlertDialog(
                  title: const Text('Bhed ki Pehchan (ID)'),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      ClipRRect(
                        borderRadius: BorderRadius.circular(8),
                        child: Image.file(File(photo.path), height: 120, width: 120, fit: BoxFit.cover),
                      ),
                      const SizedBox(height: 12),
                      TextField(
                        controller: tagController,
                        decoration: const InputDecoration(
                          labelText: 'Ear Tag Number ya Naam',
                          border: OutlineInputBorder(),
                        ),
                      ),
                    ],
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx, false), child: const Text('Cancel')),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: Colors.teal),
                      onPressed: () => Navigator.pop(ctx, true),
                      child: const Text('Save Karein', style: TextStyle(color: Colors.white)),
                    ),
                  ],
                ),
              );

              if (confirm == true) {
                setState(() => isLoading = true);
                String tag = tagController.text.trim().isEmpty ? 'Tag #${sheepList.length + 1}' : tagController.text.trim();
                String locationStr = await _getGpsLocation();

                List<int> imageBytes = await File(photo.path).readAsBytes();
                String dataUrl = "data:image/jpeg;base64,${base64Encode(imageBytes)}";

                Map<String, dynamic> newSheepData = {
                  'tagNumber': tag,
                  'photoUrl': dataUrl,
                  'isMissing': false,
                  'location': locationStr,
                };

                try {
                  final response = await http.post(Uri.parse(userSheepUrl), body: json.encode(newSheepData));
                  if (response.statusCode == 200) {
                    final responseData = json.decode(response.body);
                    setState(() {
                      sheepList.add(SheepModel(
                        id: responseData['name'],
                        tagNumber: tag,
                        photoUrl: dataUrl,
                        location: locationStr,
                      ));
                    });
                  }
                } catch (e) {
                  // Error
                } finally {
                  setState(() => isLoading = false);
                }
              }
            }

            Future<void> _toggleMissingStatus(int index) async {
              final sheep = sheepList[index];
              bool updatedStatus = !sheep.isMissing;
              setState(() => sheepList[index].isMissing = updatedStatus);

              String updateUrl = "https://sheep-master-default-rtdb.firebaseio.com/users/${widget.userPhone}/sheep/${sheep.id}.json";
              try {
                await http.patch(Uri.parse(updateUrl), body: json.encode({'isMissing': updatedStatus}));
              } catch (e) {}
            }

            void _logout() {
              Navigator.pushReplacement(context, MaterialPageRoute(builder: (context) => const AuthScreen()));
            }

            @override
            Widget build(BuildContext context) {
              int totalSheep = sheepList.length;
              int missingSheep = sheepList.where((s) => s.isMissing).length;
              int activeSheep = totalSheep - missingSheep;

              return Scaffold(
                appBar: AppBar(
                  title: Column(
                    children: [
                      const Text('AI Sheep Master Pro', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 18)),
                      Text('ID: ${widget.userPhone}', style: const TextStyle(color: Colors.white70, fontSize: 11)),
                    ],
                  ),
                  backgroundColor: Colors.teal.shade700,
                  centerTitle: true,
                  actions: [
                    IconButton(icon: const Icon(Icons.refresh, color: Colors.white), onPressed: _fetchOnlineData),
                    IconButton(icon: const Icon(Icons.logout, color: Colors.white), onPressed: _logout),
                  ],
                ),
                body: isLoading
                    ? const Center(child: CircularProgressIndicator(color: Colors.teal))
                    : Column(
                        children: [
                          Container(
                            margin: const EdgeInsets.all(12),
                            padding: const EdgeInsets.all(16),
                            decoration: BoxDecoration(
                              color: Colors.teal.shade50,
                              borderRadius: BorderRadius.circular(12),
                              border: Border.all(color: Colors.teal.shade200),
                            ),
                            child: Row(
                              mainAxisAlignment: MainAxisAlignment.spaceAround,
                              children: [
                                _buildCountCard('Kul Bhed', '$totalSheep', Colors.blue),
                                _buildCountCard('Surakshit', '$activeSheep', Colors.green),
                                _buildCountCard('Gumshuda', '$missingSheep', Colors.red),
                              ],
                            ),
                          ),
                          Expanded(
                            child: sheepList.isEmpty
                                ? const Center(
                                    child: Text(
                                      'Aapke account mein abhi koi bhed nahi hai.\nNiche button se photo aur Tag jodein!',
                                      textAlign: TextAlign.center,
                                      style: TextStyle(color: Colors.grey, fontSize: 15),
                                    ),
                                  )
                                : GridView.builder(
                                    padding: const EdgeInsets.all(12),
                                    gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                                      crossAxisCount: 2,
                                      crossAxisSpacing: 10,
                                      mainAxisSpacing: 10,
                                      childAspectRatio: 0.70,
                                    ),
                                    itemCount: sheepList.length,
                                    itemBuilder: (context, index) {
                                      final sheep = sheepList[index];
                                      return Card(
                                        elevation: 3,
                                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                                        child: Column(
                                          crossAxisAlignment: CrossAxisAlignment.stretch,
                                          children: [
                                            Expanded(
                                              child: ClipRRect(
                                                borderRadius: const BorderRadius.vertical(top: Radius.circular(12)),
                                                child: sheep.photoUrl.startsWith('data:image')
                                                    ? Image.memory(base64Decode(sheep.photoUrl.split(',').last), fit: BoxFit.cover)
                                                    : Container(color: Colors.teal.shade100, child: const Icon(Icons.pets, size: 40)),
                                              ),
                                            ),
                                            Padding(
                                              padding: const EdgeInsets.all(8.0),
                                              child: Column(
                                                crossAxisAlignment: CrossAxisAlignment.start,
                                                children: [
                                                  Text(sheep.tagNumber, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 14, color: Colors.teal)),
                                                  const SizedBox(height: 2),
                                                  Row(
                                                    children: [
                                                      const Icon(Icons.location_on, size: 12, color: Colors.red),
                                                      const SizedBox(width: 2),
                                                      Expanded(
                                                        child: Text(sheep.location, style: const TextStyle(fontSize: 10, color: Colors.grey), overflow: TextOverflow.ellipsis),
                                                      ),
                                                    ],
                                                  ),
                                                  const SizedBox(height: 6),
                                                  InkWell(
                                                    onTap: () => _toggleMissingStatus(index),
                                                    child: Container(
                                                      alignment: Alignment.center,
                                                      padding: const EdgeInsets.symmetric(vertical: 4),
                                                      decoration: BoxDecoration(
                                                        color: sheep.isMissing ? Colors.red.shade100 : Colors.green.shade100,
                                                        borderRadius: BorderRadius.circular(6),
                                                      ),
                                                      child: Text(
                                                        sheep.isMissing ? 'Khoi hui (Missing)' : 'Surakshit (Safe)',
                                                        style: TextStyle(
                                                          color: sheep.isMissing ? Colors.red.shade800 : Colors.green.shade800,
                                                          fontSize: 10,
                                                          fontWeight: FontWeight.bold,
                                                        ),
                                                      ),
                                                    ),
                                                  ),
                                                ],
                                              ),
                                            ),
                                          ],
                                        ),
                                      );
                                    },
                                  ),
                          ),
                        ],
                      ),
                floatingActionButton: FloatingActionButton.extended(
                  onPressed: _addNewSheep,
                  backgroundColor: Colors.teal,
                  icon: const Icon(Icons.add_a_photo, color: Colors.white),
                  label: const Text('Nayi ID Jodein', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                ),
              );
            }

            Widget _buildCountCard(String title, String count, Color color) {
              return Column(
                children: [
                  Text(title, style: const TextStyle(fontSize: 12, fontWeight: FontWeight.w500)),
                  const SizedBox(height: 4),
                  Text(count, style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: color)),
                ],
              );
            }
          }
          EOF

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Sheep-Master-Pro-Business-APK
          path: build/app/outputs/flutter-apk/app-release.apk
