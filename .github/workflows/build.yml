name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --org com.example --project-name sheeps_app

      - name: Add Dependencies
        run: |
          flutter pub add image_picker qr_flutter

      - name: Overwrite main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:qr_flutter/qr_flutter.dart';

          void main() {
            runApp(const SheepsApp());
          }

          class SheepModel {
            final String id;
            final String name;
            final File photo;
            final String breed;
            final String age;
            final String gender;
            bool isChecked;
            bool isMissing;

            SheepModel({
              required this.id,
              required this.name,
              required this.photo,
              this.breed = 'मारवाड़ी (Marwari)',
              this.age = '18 महीने',
              this.gender = 'मादा (Female)',
              this.isChecked = false,
              this.isMissing = false,
            });
          }

          class SheepsApp extends StatelessWidget {
            const SheepsApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'एआई भेड़ ट्रैकर एवं स्वास्थ्य देखभाल',
                theme: ThemeData(
                  primarySwatch: Colors.green,
                  useMaterial3: true,
                ),
                home: const SheepDashboard(),
              );
            }
          }

          class SheepDashboard extends StatefulWidget {
            const SheepDashboard({super.key});

            @override
            State<SheepDashboard> createState() => _SheepDashboardState();
          }

          class _SheepDashboardState extends State<SheepDashboard> {
            final List<SheepModel> sheepList = [];
            final int maxLimit = 300;
            final ImagePicker _picker = ImagePicker();
            int selectedTab = 0;

            Future<void> _captureSheepPhoto() async {
              if (sheepList.length >= maxLimit) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('अधिकतम 300 भेड़ों की सीमा पूरी हो चुकी है!')),
                );
                return;
              }

              final XFile? photo = await _picker.pickImage(source: ImageSource.camera);
              if (photo != null) {
                int nextId = sheepList.length + 1;
                setState(() {
                  sheepList.add(
                    SheepModel(
                      id: 'SHEEP_QR_$nextId',
                      name: 'भेड़ #$nextId',
                      photo: File(photo.path),
                      isChecked: true, // Nayi photo khinchne par apne aap hari tick lag jayegi
                    ),
                  );
                });
              }
            }

            // Automatic scan / verify simulation
            void _scanAndVerifySheep() async {
              final XFile? photo = await _picker.pickImage(source: ImageSource.camera);
              if (photo != null) {
                // Yahan app camera se scan karke match karega aur automatically verified kar dega
                setState(() {
                  if (sheepList.isNotEmpty) {
                    // Pehli unverified sheep ko apne aap verified (hari tick) kar dega
                    var sheep = sheepList.firstWhere((s) => !s.isChecked, orElse: () => sheepList.first);
                    sheep.isChecked = true;
                    sheep.isMissing = false;
                  }
                });
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('भेड़ सफलतापूर्वक स्कैन हो गई और हरी टिक लग गई!'), backgroundColor: Colors.green),
                );
              }
            }

            Widget _buildTrackerTab() {
              // Missing sheeps ki alag list nikalne ke liye
              List<SheepModel> missingSheepList = sheepList.where((s) => s.isMissing).toList();

              return SingleChildScrollView(
                padding: const EdgeInsets.all(16.0),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    Card(
                      elevation: 4,
                      color: Colors.green.shade50,
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                      child: Padding(
                        padding: const EdgeInsets.all(16.0),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                const Text('कुल दर्ज भेड़ें', style: TextStyle(fontSize: 14)),
                                Text('${sheepList.length} / $maxLimit', style: TextStyle(fontSize: 30, fontWeight: FontWeight.bold, color: Colors.green.shade800)),
                              ],
                            ),
                            Icon(Icons.pets, size: 44, color: Colors.green.shade700),
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 15),
                    Row(
                      children: [
                        Expanded(
                          child: ElevatedButton.icon(
                            onPressed: _captureSheepPhoto,
                            icon: const Icon(Icons.add_a_photo, color: Colors.white),
                            label: const Text('नयी भेड़ जोड़ें', style: TextStyle(fontSize: 14, color: Colors.white)),
                            style: ElevatedButton.styleFrom(
                              backgroundColor: Colors.green.shade600,
                              padding: const EdgeInsets.symmetric(vertical: 12),
                            ),
                          ),
                        ),
                        const SizedBox(width: 10),
                        Expanded(
                          child: ElevatedButton.icon(
                            onPressed: _scanAndVerifySheep,
                            icon: const Icon(Icons.qr_code_scanner, color: Colors.white),
                            label: const Text('भेड़ स्कैन करें', style: TextStyle(fontSize: 14, color: Colors.white)),
                            style: ElevatedButton.styleFrom(
                              backgroundColor: Colors.blue.shade700,
                              padding: const EdgeInsets.symmetric(vertical: 12),
                            ),
                          ),
                        ),
                      ],
                    ),
                    const SizedBox(height: 20),

                    // Agar koi bhed missing hai to uski alag se red alert list dikegi
                    if (missingSheepList.isNotEmpty) ...[
                      const Text('⚠️ खोई हुई (Missing) भेड़ें:', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.red)),
                      const SizedBox(height: 8),
                      SizedBox(
                        height: 110,
                        child: ListView.builder(
                          scrollDirection: Axis.horizontal,
                          itemCount: missingSheepList.length,
                          itemBuilder: (context, index) {
                            final sheep = missingSheepList[index];
                            return Container(
                              width: 100,
                              margin: const EdgeInsets.only(right: 10),
                              decoration: BoxDecoration(
                                border: Border.all(color: Colors.red, width: 2),
                                borderRadius: BorderRadius.circular(10),
                              ),
                              child: Stack(
                                children: [
                                  ClipRRect(
                                    borderRadius: BorderRadius.circular(8),
                                    child: Image.file(sheep.photo, width: 100, height: 110, fit: BoxFit.cover),
                                  ),
                                  const Positioned(
                                    top: 4,
                                    right: 4,
                                    child: CircleAvatar(
                                      radius: 12,
                                      backgroundColor: Colors.red,
                                      child: Icon(Icons.close, color: Colors.white, size: 16),
                                    ),
                                  ),
                                  Positioned(
                                    bottom: 0,
                                    left: 0,
                                    right: 0,
                                    child: Container(
                                      color: Colors.red.withOpacity(0.8),
                                      padding: const EdgeInsets.all(2),
                                      child: Text(sheep.name, textAlign: TextAlign.center, style: const TextStyle(color: Colors.white, fontSize: 10)),
                                    ),
                                  ),
                                ],
                              ),
                            );
                          },
                        ),
                      ),
                      const SizedBox(height: 20),
                    ],

                    const Text('सभी सहेजी गई भेड़ें:', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 10),
                    sheepList.isEmpty
                        ? const Center(child: Padding(padding: EdgeInsets.all(20), child: Text('अभी तक कोई भेड़ दर्ज नहीं की गई है।')))
                        : GridView.builder(
                            shrinkWrap: true,
                            physics: const NeverScrollableScrollPhysics(),
                            gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                              crossAxisCount: 3,
                              crossAxisSpacing: 8,
                              mainAxisSpacing: 8,
                            ),
                            itemCount: sheepList.length,
                            itemBuilder: (context, index) {
                              final sheep = sheepList[index];
                              return GestureDetector(
                                onTap: () {
                                  setState(() {
                                    // Click karne par status badal sakte hain
                                    sheep.isChecked = !sheep.isChecked;
                                    if (sheep.isChecked) sheep.isMissing = false;
                                  });
                                },
                                child: Stack(
                                  children: [
                                    ClipRRect(
                                      borderRadius: BorderRadius.circular(8),
                                      child: Image.file(sheep.photo, width: double.infinity, height: double.infinity, fit: BoxFit.cover),
                                    ),
                                    if (sheep.isChecked)
                                      Positioned(
                                        top: 4,
                                        right: 4,
                                        child: Container(
                                          padding: const EdgeInsets.all(2),
                                          decoration: const BoxDecoration(color: Colors.green, shape: BoxShape.circle),
                                          child: const Icon(Icons.check, color: Colors.white, size: 14),
                                        ),
                                      ),
                                    if (sheep.isMissing)
                                      Positioned(
                                        top: 4,
                                        right: 4,
                                        child: Container(
                                          padding: const EdgeInsets.all(2),
                                          decoration: const BoxDecoration(color: Colors.red, shape: BoxShape.circle),
                                          child: const Icon(Icons.close, color: Colors.white, size: 14),
                                        ),
                                      ),
                                    Positioned(
                                      bottom: 4,
                                      left: 4,
                                      child: Container(
                                        color: Colors.black54,
                                        padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 2),
                                        child: Text(sheep.name, style: const TextStyle(color: Colors.white, fontSize: 11)),
                                      ),
                                    ),
                                  ],
                                ),
                              );
                            },
                          ),
                  ],
                ),
              );
            }

            Widget _buildMedicineGuideTab() {
              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  const Text('💉 टीका एवं दवा मार्गदर्शिका (स्वास्थ्य गाइड)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.green)),
                  const SizedBox(height: 8),
                  Card(
                    child: ListTile(
                      leading: const Icon(Icons.vaccines, color: Colors.blue, size: 30),
                      title: const Text('पीपीआर का टीका (PPR Vaccine)', style: TextStyle(fontWeight: FontWeight.bold)),
                      subtitle: const Text('• कब लगाएं: 3 महीने की उम्र में (हर 3 साल में एक बार)।\n• कैसे दें: चमड़ी के नीचे 1 मिलीलीटर।\n• फायदा: महामारी बुखार और दस्त से बचाव।'),
                    ),
                  ),
                  Card(
                    child: ListTile(
                      leading: const Icon(Icons.vaccines, color: Colors.red, size: 30),
                      title: const Text('खुरपका-मुँहपका टीका (FMD)', style: TextStyle(fontWeight: FontWeight.bold)),
                      subtitle: const Text('• कब लगाएं: साल में 2 बार (मई-जून और नवंबर-दिसंबर)।\n• कैसे दें: मांस में 2 मिलीलीटर।\n• फायदा: मुँह और खुर के घावों से सुरक्षा।'),
                    ),
                  ),
                ],
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('एआई भेड़ ट्रैकर एवं स्वास्थ्य देखभाल', style: TextStyle(color: Colors.white)),
                  backgroundColor: Colors.green.shade700,
                  centerTitle: true,
                ),
                body: selectedTab == 0 ? _buildTrackerTab() : _buildMedicineGuideTab(),
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: selectedTab,
                  onTap: (index) {
                    setState(() {
                      selectedTab = index;
                    });
                  },
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.pets), label: 'भेड़ प्रोफाइल'),
                    BottomNavigationBarItem(icon: Icon(Icons.medical_services), label: 'स्वास्थ्य गाइड'),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
