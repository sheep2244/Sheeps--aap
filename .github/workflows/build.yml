name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          mkdir -p /tmp/my_lib
          cp -r lib/* /tmp/my_lib/
          rm -rf android
          flutter create . --org com.example --project-name sheeps_app
          rm -rf lib
          mkdir -p lib
          cp -r /tmp/my_lib/* lib/

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Clean, Get Dependencies and Build APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
