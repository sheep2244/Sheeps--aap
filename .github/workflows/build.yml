name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --org com.example --project-name sheeps_app

      - name: Add Dependencies
        run: |
          flutter pub add image_picker qr_flutter

      - name: Overwrite main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:qr_flutter/qr_flutter.dart';

          void main() {
            runApp(const SheepsApp());
          }

          class SheepModel {
            final String id;
            final String name;
            final File photo;
            final String medicalNotes;

            SheepModel({
              required this.id,
              required this.name,
              required this.photo,
              this.medicalNotes = 'Healthy / No medication given',
            });
          }

          class SheepsApp extends StatelessWidget {
            const SheepsApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'AI Sheep Tracker & Health Care',
                theme: ThemeData(
                  primarySwatch: Colors.green,
                  useMaterial3: true,
                ),
                home: const SheepDashboard(),
              );
            }
          }

          class SheepDashboard extends StatefulWidget {
            const SheepDashboard({super.key});

            @override
            State<SheepDashboard> createState() => _SheepDashboardState();
          }

          class _SheepDashboardState extends State<SheepDashboard> {
            final List<SheepModel> sheepList = [];
            final int maxLimit = 300;
            final ImagePicker _picker = ImagePicker();
            int selectedTab = 0;

            Future<void> _captureSheepPhoto() async {
              if (sheepList.length >= maxLimit) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Maximum limit of 300 sheeps reached!')),
                );
                return;
              }

              final XFile? photo = await _picker.pickImage(source: ImageSource.camera);
              if (photo != null) {
                int nextId = sheepList.length + 1;
                setState(() {
                  sheepList.add(
                    SheepModel(
                      id: 'SHEEP_QR_$nextId',
                      name: 'Bhed #$nextId',
                      photo: File(photo.path),
                    ),
                  );
                });
              }
            }

            void _showSheepDetails(SheepModel sheep) {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(top: Radius.circular(20)),
                ),
                builder: (context) {
                  return Padding(
                    padding: const EdgeInsets.all(20.0),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        Text(sheep.name, style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold)),
                        const SizedBox(height: 10),
                        ClipRRect(
                          borderRadius: BorderRadius.circular(12),
                          child: Image.file(sheep.photo, height: 180, width: double.infinity, fit: BoxFit.cover),
                        ),
                        const SizedBox(height: 15),
                        const Text('Sheep Unique QR Code (Scannable Offline):', style: TextStyle(fontWeight: FontWeight.bold)),
                        const SizedBox(height: 10),
                        QrImageView(
                          data: sheep.id,
                          version: QrVersions.auto,
                          size: 140.0,
                        ),
                        const SizedBox(height: 15),
                        Container(
                          width: double.infinity,
                          padding: const EdgeInsets.all(12),
                          decoration: BoxDecoration(
                            color: Colors.green.shade50,
                            borderRadius: BorderRadius.circular(8),
                          ),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              const Text('💊 Medical & Health History:', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.green)),
                              const SizedBox(height: 4),
                              Text(sheep.medicalNotes),
                            ],
                          ),
                        ),
                        const SizedBox(height: 15),
                      ],
                    ),
                  );
                },
              );
            }

            Widget _buildTrackerTab() {
              return SingleChildScrollView(
                padding: const EdgeInsets.all(16.0),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    Card(
                      elevation: 4,
                      color: Colors.green.shade50,
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                      child: Padding(
                        padding: const EdgeInsets.all(16.0),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                const Text('Total Registered Sheeps', style: TextStyle(fontSize: 14)),
                                Text('${sheepList.length} / $maxLimit', style: TextStyle(fontSize: 30, fontWeight: FontWeight.bold, color: Colors.green.shade800)),
                              ],
                            ),
                            Icon(Icons.pets, size: 44, color: Colors.green.shade700),
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 15),
                    ElevatedButton.icon(
                      onPressed: _captureSheepPhoto,
                      icon: const Icon(Icons.add_a_photo, color: Colors.white),
                      label: const Text('Take Photo & Generate QR Code', style: TextStyle(fontSize: 16, color: Colors.white)),
                      style: ElevatedButton.styleFrom(
                        backgroundColor: Colors.green.shade600,
                        padding: const EdgeInsets.symmetric(vertical: 14),
                      ),
                    ),
                    const SizedBox(height: 20),
                    const Text('Saved Sheep Profiles (Click to view QR & Details):', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 10),
                    sheepList.isEmpty
                        ? const Center(child: Padding(padding: EdgeInsets.all(20), child: Text('No sheep registered yet.')))
                        : GridView.builder(
                            shrinkWrap: true,
                            physics: const NeverScrollableScrollPhysics(),
                            gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                              crossAxisCount: 3,
                              crossAxisSpacing: 8,
                              mainAxisSpacing: 8,
                            ),
                            itemCount: sheepList.length,
                            itemBuilder: (context, index) {
                              final sheep = sheepList[index];
                              return GestureDetector(
                                onTap: () => _showSheepDetails(sheep),
                                child: Stack(
                                  children: [
                                    ClipRRect(
                                      borderRadius: BorderRadius.circular(8),
                                      child: Image.file(sheep.photo, width: double.infinity, height: double.infinity, fit: BoxFit.cover),
                                    ),
                                    Positioned(
                                      bottom: 4,
                                      left: 4,
                                      child: Container(
                                        color: Colors.black54,
                                        padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 2),
                                        child: Text(sheep.name, style: const TextStyle(color: Colors.white, fontSize: 11)),
                                      ),
                                    ),
                                  ],
                                ),
                              );
                            },
                          ),
                  ],
                ),
              );
            }

            Widget _buildMedicineGuideTab() {
              return ListView(
                padding: const EdgeInsets.all(16),
                children: const [
                  Text('💉 Vaccination Schedule (टीकाकरण समय सारणी)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.green)),
                  SizedBox(height: 8),
                  Card(
                    child: ListTile(
                      leading: Icon(Icons.vaccines, color: Colors.blue),
                      title: Text('PPR Vaccine (पीपीआर का टीका)'),
                      subtitle: Text('कब लगाएं: 3 महीने की उम्र में (हर 3 साल में एक बार)\nफायदा: महामारी बुखार और दस्त से बचाव।'),
                    ),
                  ),
                  Card(
                    child: ListTile(
                      leading: Icon(Icons.vaccines, color: Colors.red),
                      title: Text('FMD Vaccine (खुरपका-मुँहपका)'),
                      subtitle: Text('कब लगाएं: साल में 2 बार (मई-जून और नवंबर-दिसंबर)\nफायदा: मुँह और खुर के छालों से बचाव।'),
                    ),
                  ),
                  Card(
                    child: ListTile(
                      leading: Icon(Icons.vaccines, color: Colors.purple),
                      title: Text('Sheep Pox Vaccine (भेड़ चेचक)'),
                      subtitle: Text('कब लगाएं: साल में एक बार (दिसंबर-जनवरी)\nफायदा: त्वचा के दानों और बुखार से सुरक्षा।'),
                    ),
                  ),
                  SizedBox(height: 20),
                  Text('🩺 Common Diseases & Medicines (बीमारी और दवाइयाँ)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.green)),
                  SizedBox(height: 8),
                  Card(
                    child: ListTile(
                      leading: Icon(Icons.medication, color: Colors.orange),
                      title: Text('पेट के कीड़े (Worms / Parasites)'),
                      subtitle: Text('लक्षण: दुबलापन, कमज़ोरी\nदवा: Albendazole या Ivermectin (डॉक्टर की सलाह से)'),
                    ),
                  ),
                  Card(
                    child: ListTile(
                      leading: Icon(Icons.medication, color: Colors.teal),
                      title: Text('दस्त और पेट खराब (Diarrhea)'),
                      subtitle: Text('लक्षण: पतला गोबर, डिहाइड्रेशन\nदवा: Bolus Neblon / ORS घोल'),
                    ),
                  ),
                ],
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('AI Sheep Tracker & Health Care', style: TextStyle(color: Colors.white)),
                  backgroundColor: Colors.green.shade700,
                  centerTitle: true,
                ),
                body: selectedTab == 0 ? _buildTrackerTab() : _buildMedicineGuideTab(),
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: selectedTab,
                  onTap: (index) {
                    setState(() {
                      selectedTab = index;
                    });
                  },
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.pets), label: 'Sheep Profiles & QR'),
                    BottomNavigationBarItem(icon: Icon(Icons.medical_services), label: 'Medicine & Vaccines'),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
