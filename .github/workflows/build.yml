name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: 'stable'

      - name: Recreate Android Project Safely
        run: |
          # 1. Poore original code ka safe backup lein
          mkdir -p /tmp/ff_backup
          cp -r lib /tmp/ff_backup/
          
          # 2. Android folder recreate karein
          rm -rf android
          flutter create . --org com.example --project-name sheeps_app
          
          # 3. FlutterFlow ka poora code wapas restore karein
          rm -rf lib
          cp -r /tmp/ff_backup/lib .
          
          # 4. Agar lib ke andar index.dart ya koi asli FlutterFlow main file hai, use set karein
          if [ -f "lib/index.dart" ]; then
            echo "import 'index.dart';" > lib/main_entry.dart
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          if [ -f "lib/index.dart" ]; then
            flutter build apk --release --target=lib/index.dart --no-tree-shake-icons
          else
            flutter build apk --release --no-tree-shake-icons
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
