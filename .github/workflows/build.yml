name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --org com.example --project-name sheeps_app

      - name: Add Dependencies
        run: |
          flutter pub add image_picker

      - name: Overwrite main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';

          void main() {
            runApp(const SheepsApp());
          }

          class SheepsApp extends StatelessWidget {
            const SheepsApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'AI Sheep Master',
                theme: ThemeData(
                  primarySwatch: Colors.green,
                  useMaterial3: true,
                ),
                home: const DashboardScreen(),
              );
            }
          }

          class DashboardScreen extends StatefulWidget {
            const DashboardScreen({super.key});

            @override
            State<DashboardScreen> createState() => _DashboardScreenState();
          }

          class _DashboardScreenState extends State<DashboardScreen> {
            final List<String> sheepList = [];
            final ImagePicker _picker = ImagePicker();

            Future<void> _addNewSheep() async {
              final XFile? photo = await _picker.pickImage(source: ImageSource.camera);
              if (photo != null) {
                setState(() {
                  sheepList.add(photo.path);
                });
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('Nayi bhed jodi gayi! Kul sankhya: ${sheepList.length}'), backgroundColor: Colors.green),
                );
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('AI Sheep Master', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                  backgroundColor: Colors.teal.shade700,
                  centerTitle: true,
                ),
                body: Column(
                  children: [
                    Padding(
                      padding: const EdgeInsets.all(16.0),
                      child: ElevatedButton.icon(
                        onPressed: _addNewSheep,
                        icon: const Icon(Icons.camera_alt, color: Colors.white),
                        label: const Text('Nayi Bhed Jodein', style: TextStyle(color: Colors.white)),
                        style: ElevatedButton.styleFrom(
                          backgroundColor: Colors.teal,
                          minimumSize: const Size(double.infinity, 50),
                        ),
                      ),
                    ),
                    Expanded(
                      child: sheepList.isEmpty
                          ? const Center(child: Text('Abhi tak koi bhed darj nahi ki gayi hai.', style: TextStyle(fontSize: 16)))
                          : ListView.builder(
                              itemCount: sheepList.length,
                              itemBuilder: (context, index) {
                                return Card(
                                  margin: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                                  child: ListTile(
                                    leading: ClipRRect(
                                      borderRadius: BorderRadius.circular(8),
                                      child: Image.file(File(sheepList[index]), width: 50, height: 50, fit: BoxFit.cover),
                                    ),
                                    title: Text('Bhed #${index + 1}', style: const TextStyle(fontWeight: FontWeight.bold)),
                                    subtitle: const Text('Marwari Breed - Verified'),
                                    trailing: const Icon(Icons.check_circle, color: Colors.green),
                                  ),
                                );
                              },
                            ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Build APK
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
