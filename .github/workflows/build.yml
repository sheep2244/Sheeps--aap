name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --org com.example --project-name sheep_master

      - name: Add Dependencies
        run: |
          flutter pub add image_picker

      - name: Overwrite main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';

          void main() {
            runApp(const SheepMasterApp());
          }

          class SheepModel {
            final String id;
            final String name;
            File photo;
            bool isMissing;

            SheepModel({
              required this.id,
              required this.name,
              required this.photo,
              this.isMissing = false,
            });
          }

          class SheepMasterApp extends StatelessWidget {
            const SheepMasterApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'AI Sheep Master',
                theme: ThemeData(
                  primarySwatch: Colors.teal,
                  useMaterial3: true,
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            final List<SheepModel> sheepList = [];
            final ImagePicker _picker = ImagePicker();

            Future<void> _addNewSheep() async {
              final XFile? photo = await _picker.pickImage(source: ImageSource.camera);
              if (photo != null) {
                int nextId = sheepList.length + 1;
                setState(() {
                  sheepList.add(
                    SheepModel(
                      id: 'SHP_$nextId',
                      name: 'Bhed #$nextId',
                      photo: File(photo.path),
                    ),
                  );
                });
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(
                      content: Text('Bhed #$nextId safaltapurvak jodi gayi!'),
                      backgroundColor: Colors.teal,
                    ),
                  );
                }
              }
            }

            void _toggleMissingStatus(int index) {
              setState(() {
                sheepList[index].isMissing = !sheepList[index].isMissing;
              });
            }

            @override
            Widget build(BuildContext context) {
              int totalSheep = sheepList.length;
              int missingSheep = sheepList.where((s) => s.isMissing).length;
              int activeSheep = totalSheep - missingSheep;

              return Scaffold(
                appBar: AppBar(
                  title: const Text('AI Sheep Master', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                  backgroundColor: Colors.teal.shade700,
                  centerTitle: true,
                ),
                body: Column(
                  children: [
                    // Summary Banner
                    Container(
                      margin: const EdgeInsets.all(12),
                      padding: const EdgeInsets.all(16),
                      decoration: BoxDecoration(
                        color: Colors.teal.shade50,
                        borderRadius: BorderRadius.circular(12),
                        border: Border.all(color: Colors.teal.shade200),
                      ),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceAround,
                        children: [
                          _buildCountCard('Kul Bhed', '$totalSheep', Colors.blue),
                          _buildCountCard('Surakshit', '$activeSheep', Colors.green),
                          _buildCountCard('Gumshuda', '$missingSheep', Colors.red),
                        ],
                      ),
                    ),

                    // Cattle Grid / List
                    Expanded(
                      child: sheepList.isEmpty
                          ? Center(
                              child: Column(
                                mainAxisAlignment: MainAxisAlignment.center,
                                children: const [
                                  Icon(Icons.pets, size: 64, color: Colors.grey),
                                  SizedBox(height: 10),
                                  Text(
                                    'Abhi tak koi bhed darj nahi hai.\nNiche diye button se jodein!',
                                    textAlign: TextAlign.center,
                                    style: TextStyle(color: Colors.grey, fontSize: 16),
                                  ),
                                ],
                              ),
                            )
                          : GridView.builder(
                              padding: const EdgeInsets.all(12),
                              gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                                crossAxisCount: 2,
                                crossAxisSpacing: 10,
                                mainAxisSpacing: 10,
                                childAspectRatio: 0.75,
                              ),
                              itemCount: sheepList.length,
                              itemBuilder: (context, index) {
                                final sheep = sheepList[index];
                                return Card(
                                  elevation: 3,
                                  shape: RoundedRectangleBorder(
                                    borderRadius: BorderRadius.circular(12),
                                  ),
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.stretch,
                                    children: [
                                      Expanded(
                                        child: ClipRRect(
                                          borderRadius: const BorderRadius.vertical(top: Radius.circular(12)),
                                          child: Image.file(
                                            sheep.photo,
                                            fit: BoxFit.cover,
                                            width: double.infinity,
                                          ),
                                        ),
                                      ),
                                      Padding(
                                        padding: const EdgeInsets.all(8.0),
                                        child: Column(
                                          crossAxisAlignment: CrossAxisAlignment.start,
                                          children: [
                                            Text(
                                              sheep.name,
                                              style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 14),
                                            ),
                                            const SizedBox(height: 4),
                                            InkWell(
                                              onTap: () => _toggleMissingStatus(index),
                                              child: Container(
                                                padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                                                decoration: BoxDecoration(
                                                  color: sheep.isMissing ? Colors.red.shade100 : Colors.green.shade100,
                                                  borderRadius: BorderRadius.circular(6),
                                                ),
                                                child: Text(
                                                  sheep.isMissing ? 'Status: Missing' : 'Status: Safe',
                                                  style: TextStyle(
                                                    color: sheep.isMissing ? Colors.red.shade800 : Colors.green.shade800,
                                                    fontSize: 11,
                                                    fontWeight: FontWeight.bold,
                                                  ),
                                                ),
                                              ),
                                            ),
                                          ],
                                        ),
                                      ),
                                    ],
                                  ),
                                );
                              },
                            ),
                    ),
                  ],
                ),
                floatingActionButton: FloatingActionButton.extended(
                  onPressed: _addNewSheep,
                  backgroundColor: Colors.teal,
                  icon: const Icon(Icons.add_a_photo, color: Colors.white),
                  label: const Text('Nayi Bhed Jodein', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                ),
              );
            }

            Widget _buildCountCard(String title, String count, Color color) {
              return Column(
                children: [
                  Text(title, style: const TextStyle(fontSize: 12, fontWeight: FontWeight.w500)),
                  const SizedBox(height: 4),
                  Text(
                    count,
                    style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: color),
                  ),
                ],
              );
            }
          }
          EOF

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SheepMaster-Phase1-APK
          path: build/app/outputs/flutter-apk/app-release.apk
