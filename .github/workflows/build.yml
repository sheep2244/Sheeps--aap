name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --org com.example --project-name sheeps_app

      - name: Add Dependencies
        run: |
          flutter pub add image_picker qr_flutter

      - name: Overwrite main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:qr_flutter/qr_flutter.dart';

          void main() {
            runApp(const SheepsApp());
          }

          class SheepModel {
            final String id;
            final String name;
            final File photo;
            final String breed;
            final String age;
            final String gender;
            bool isChecked;
            bool isMissing;

            SheepModel({
              required this.id,
              required this.name,
              required this.photo,
              this.breed = 'मारवाड़ी (Marwari)',
              this.age = '18 महीने',
              this.gender = 'मादा (Female)',
              this.isChecked = false,
              this.isMissing = false,
            });
          }

          class SheepsApp extends StatelessWidget {
            const SheepsApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'एआई भेड़ ट्रैकर एवं स्वास्थ्य देखभाल',
                theme: ThemeData(
                  primarySwatch: Colors.green,
                  useMaterial3: true,
                ),
                home: const SheepDashboard(),
              );
            }
          }

          class SheepDashboard extends StatefulWidget {
            const SheepDashboard({super.key});

            @override
            State<SheepDashboard> createState() => _SheepDashboardState();
          }

          class _SheepDashboardState extends State<SheepDashboard> {
            final List<SheepModel> sheepList = [];
            final int maxLimit = 300;
            final ImagePicker _picker = ImagePicker();
            int selectedTab = 0;

            Future<void> _captureSheepPhoto() async {
              if (sheepList.length >= maxLimit) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('अधिकतम 300 भेड़ों की सीमा पूरी हो चुकी है!')),
                );
                return;
              }

              final XFile? photo = await _picker.pickImage(source: ImageSource.camera);
              if (photo != null) {
                int nextId = sheepList.length + 1;
                setState(() {
                  sheepList.add(
                    SheepModel(
                      id: 'SHEEP_QR_$nextId',
                      name: 'भेड़ #$nextId',
                      photo: File(photo.path),
                    ),
                  );
                });
              }
            }

            void _toggleStatus(SheepModel sheep, bool? checked, bool? missing) {
              setState(() {
                if (checked != null) sheep.isChecked = checked;
                if (missing != null) sheep.isMissing = missing;
              });
            }

            void _showSheepDetails(SheepModel sheep) {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: Colors.transparent,
                builder: (context) {
                  return StatefulBuilder(
                    builder: (context, setModalState) {
                      return Container(
                        decoration: const BoxDecoration(
                          color: Color(0xFFE8F5E9),
                          borderRadius: BorderRadius.vertical(top: Radius.circular(25)),
                        ),
                        padding: const EdgeInsets.all(20.0),
                        child: SingleChildScrollView(
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              Container(
                                width: 40,
                                height: 4,
                                decoration: BoxDecoration(
                                  color: Colors.green.shade300,
                                  borderRadius: BorderRadius.circular(2),
                                ),
                              ),
                              const SizedBox(height: 15),
                              Container(
                                padding: const EdgeInsets.all(16),
                                decoration: BoxDecoration(
                                  color: Colors.white,
                                  borderRadius: BorderRadius.circular(20),
                                  boxShadow: [
                                    BoxShadow(
                                      color: Colors.green.withOpacity(0.2),
                                      blurRadius: 10,
                                      spreadRadius: 2,
                                    )
                                  ],
                                ),
                                child: Column(
                                  children: [
                                    const Text(
                                      'डिजिटल पहचान पत्र (Digital ID)',
                                      style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.green),
                                    ),
                                    const SizedBox(height: 12),
                                    Stack(
                                      alignment: Alignment.topRight,
                                      children: [
                                        ClipOval(
                                          child: Image.file(
                                            sheep.photo,
                                            height: 130,
                                            width: 130,
                                            fit: BoxFit.cover,
                                          ),
                                        ),
                                        if (sheep.isChecked)
                                          const CircleAvatar(
                                            radius: 16,
                                            backgroundColor: Colors.green,
                                            child: Icon(Icons.check, color: Colors.white, size: 20),
                                          ),
                                        if (sheep.isMissing)
                                          const CircleAvatar(
                                            radius: 16,
                                            backgroundColor: Colors.red,
                                            child: Icon(Icons.close, color: Colors.white, size: 20),
                                          ),
                                      ],
                                    ),
                                    const SizedBox(height: 12),
                                    Text(
                                      sheep.name,
                                      style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Colors.black87),
                                    ),
                                    const Divider(height: 25),
                                    Row(
                                      mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                      children: [
                                        Column(
                                          crossAxisAlignment: CrossAxisAlignment.start,
                                          children: [
                                            Text('आईडी: ${sheep.id}', style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.grey)),
                                            const SizedBox(height: 6),
                                            Text('नस्ल: ${sheep.breed}', style: const TextStyle(fontSize: 14)),
                                            const SizedBox(height: 6),
                                            Text('उम्र: ${sheep.age}', style: const TextStyle(fontSize: 14)),
                                            const SizedBox(height: 6),
                                            Text('लिंग: ${sheep.gender}', style: const TextStyle(fontSize: 14)),
                                          ],
                                        ),
                                        QrImageView(
                                          data: sheep.id,
                                          version: QrVersions.auto,
                                          size: 80.0,
                                        ),
                                      ],
                                    ),
                                    const SizedBox(height: 15),
                                    Row(
                                      mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                                      children: [
                                        ElevatedButton.icon(
                                          onPressed: () {
                                            setModalState(() {
                                              sheep.isChecked = !sheep.isChecked;
                                              if (sheep.isChecked) sheep.isMissing = false;
                                            });
                                            _toggleStatus(sheep, sheep.isChecked, null);
                                          },
                                          icon: Icon(Icons.check_circle, color: sheep.isChecked ? Colors.white : Colors.green),
                                          label: Text(sheep.isChecked ? 'मिल गई (Verified)' : 'उपस्थित दर्ज करें'),
                                          style: ElevatedButton.styleFrom(
                                            backgroundColor: sheep.isChecked ? Colors.green : Colors.white,
                                            foregroundColor: sheep.isChecked ? Colors.white : Colors.green,
                                          ),
                                        ),
                                        ElevatedButton.icon(
                                          onPressed: () {
                                            setModalState(() {
                                              sheep.isMissing = !sheep.isMissing;
                                              if (sheep.isMissing) sheep.isChecked = false;
                                            });
                                            _toggleStatus(sheep, null, sheep.isMissing);
                                          },
                                          icon: Icon(Icons.warning, color: sheep.isMissing ? Colors.white : Colors.red),
                                          label: Text(sheep.isMissing ? 'खोई हुई (Missing)' : 'गुम घोषित करें'),
                                          style: ElevatedButton.styleFrom(
                                            backgroundColor: sheep.isMissing ? Colors.red : Colors.white,
                                            foregroundColor: sheep.isMissing ? Colors.white : Colors.red,
                                          ),
                                        ),
                                      ],
                                    ),
                                  ],
                                ),
                              ),
                              const SizedBox(height: 20),
                            ],
                          ),
                        ),
                      );
                    },
                  );
                },
              );
            }

            Widget _buildTrackerTab() {
              return SingleChildScrollView(
                padding: const EdgeInsets.all(16.0),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    Card(
                      elevation: 4,
                      color: Colors.green.shade50,
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                      child: Padding(
                        padding: const EdgeInsets.all(16.0),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                const Text('कुल दर्ज भेड़ें', style: TextStyle(fontSize: 14)),
                                Text('${sheepList.length} / $maxLimit', style: TextStyle(fontSize: 30, fontWeight: FontWeight.bold, color: Colors.green.shade800)),
                              ],
                            ),
                            Icon(Icons.pets, size: 44, color: Colors.green.shade700),
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 15),
                    ElevatedButton.icon(
                      onPressed: _captureSheepPhoto,
                      icon: const Icon(Icons.add_a_photo, color: Colors.white),
                      label: const Text('फोटो खींचें और QR कोड बनाएं', style: TextStyle(fontSize: 16, color: Colors.white)),
                      style: ElevatedButton.styleFrom(
                        backgroundColor: Colors.green.shade600,
                        padding: const EdgeInsets.symmetric(vertical: 14),
                      ),
                    ),
                    const SizedBox(height: 20),
                    const Text('सहेजी गई भेड़ें (हरी टिक = मिल गई, लाल निशान = गुम):', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 10),
                    sheepList.isEmpty
                        ? const Center(child: Padding(padding: EdgeInsets.all(20), child: Text('अभी तक कोई भेड़ दर्ज नहीं की गई है।')))
                        : GridView.builder(
                            shrinkWrap: true,
                            physics: const NeverScrollableScrollPhysics(),
                            gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                              crossAxisCount: 3,
                              crossAxisSpacing: 8,
                              mainAxisSpacing: 8,
                            ),
                            itemCount: sheepList.length,
                            itemBuilder: (context, index) {
                              final sheep = sheepList[index];
                              return GestureDetector(
                                onTap: () => _showSheepDetails(sheep),
                                child: Stack(
                                  children: [
                                    ClipRRect(
                                      borderRadius: BorderRadius.circular(8),
                                      child: Image.file(sheep.photo, width: double.infinity, height: double.infinity, fit: BoxFit.cover),
                                    ),
                                    if (sheep.isChecked)
                                      Positioned(
                                        top: 4,
                                        right: 4,
                                        child: Container(
                                          padding: const EdgeInsets.all(2),
                                          decoration: const BoxDecoration(color: Colors.green, shape: BoxShape.circle),
                                          child: const Icon(Icons.check, color: Colors.white, size: 14),
                                        ),
                                      ),
                                    if (sheep.isMissing)
                                      Positioned(
                                        top: 4,
                                        right: 4,
                                        child: Container(
                                          padding: const EdgeInsets.all(2),
                                          decoration: const BoxDecoration(color: Colors.red, shape: BoxShape.circle),
                                          child: const Icon(Icons.close, color: Colors.white, size: 14),
                                        ),
                                      ),
                                    Positioned(
                                      bottom: 4,
                                      left: 4,
                                      child: Container(
                                        color: Colors.black54,
                                        padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 2),
                                        child: Text(sheep.name, style: const TextStyle(color: Colors.white, fontSize: 11)),
                                      ),
                                    ),
                                  ],
                                ),
                              );
                            },
                          ),
                  ],
                ),
              );
            }

            Widget _buildMedicineGuideTab() {
              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  const Text('💉 टीका एवं दवा मार्गदर्शिका (स्वास्थ्य गाइड)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.green)),
                  const SizedBox(height: 8),
                  
                  // 1. PPR Vaccine
                  Card(
                    elevation: 3,
                    child: Padding(
                      padding: const EdgeInsets.all(12.0),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            children: [
                              Container(
                                padding: const EdgeInsets.all(8),
                                decoration: BoxDecoration(color: Colors.blue.shade50, borderRadius: BorderRadius.circular(8)),
                                child: const Icon(Icons.vaccines, color: Colors.blue, size: 30),
                              ),
                              const SizedBox(width: 12),
                              const Expanded(
                                child: Text('पीपीआर का टीका (PPR Vaccine)', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                              ),
                            ],
                          ),
                          const SizedBox(height: 8),
                          const Text('• कब लगाएं: 3 महीने की उम्र में (हर 3 साल में एक बार)।\n• कैसे दें: चमड़ी के नीचे (Subcutaneous) 1 मिलीलीटर इंजेक्शन।\n• फायदा: महामारी बुखार, मुँह के छाले और दस्त से बचाव।'),
                        ],
                      ),
                    ),
                  ),

                  // 2. FMD Vaccine
                  Card(
                    elevation: 3,
                    child: Padding(
                      padding: const EdgeInsets.all(12.0),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            children: [
                              Container(
                                padding: const EdgeInsets.all(8),
                                decoration: BoxDecoration(color: Colors.red.shade50, borderRadius: BorderRadius.circular(8)),
                                child: const Icon(Icons.vaccines, color: Colors.red, size: 30),
                              ),
                              const SizedBox(width: 12),
                              const Expanded(
                                child: Text('खुरपका-मुँहपका टीका (FMD Vaccine)', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                              ),
                            ],
                          ),
                          const SizedBox(height: 8),
                          const Text('• कब लगाएं: साल में 2 बार (मई-जून और नवंबर-दिसंबर)।\n• कैसे दें: मांस में (Muscle) 2 मिलीलीटर इंजेक्शन।\n• फायदा: मुँह और खुर के घावों से संपूर्ण सुरक्षा।'),
                        ],
                      ),
                    ),
                  ),

                  // 3. Sheep Pox Vaccine
                  Card(
                    elevation: 3,
                    child: Padding(
                      padding: const EdgeInsets.all(12.0),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            children: [
                              Container(
                                padding: const EdgeInsets.all(8),
                                decoration: BoxDecoration(color: Colors.purple.shade50, borderRadius: BorderRadius.circular(8)),
                                child: const Icon(Icons.vaccines, color: Colors.purple, size: 30),
                              ),
                              const SizedBox(width: 12),
                              const Expanded(
                                child: Text('भेड़ चेचक का टीका (Sheep Pox)', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                              ),
                            ],
                          ),
                          const SizedBox(height: 8),
                          const Text('• कब लगाएं: साल में 1 बार (दिसंबर से जनवरी के बीच)।\n• कैसे दें: 0.5 मिलीलीटर चमड़ी में टीका लगाएं।\n• फायदा: त्वचा पर होने वाले दानों और बुखार से बचाव।'),
                        ],
                      ),
                    ),
                  ),

                  // 4. Deworming
                  Card(
                    elevation: 3,
                    child: Padding(
                      padding: const EdgeInsets.all(12.0),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                          Row(
                            children: [
                              Container(
                                padding: const EdgeInsets.all(8),
                                decoration: BoxDecoration(color: Colors.orange.shade50, borderRadius: BorderRadius.circular(8)),
                                child: const Icon(Icons.medication, color: Colors.orange, size: 30),
                              ),
                              const SizedBox(width: 12),
                              const Expanded(
                                child: Text('पेट के कीड़े की दवा (Deworming)', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                              ),
                            ],
                          ),
                          const SizedBox(height: 8),
                          const Text('• कब पिलाएं: हर 3 महीने में एक बार (बरसात शुरू होने से पहले अवश्य)।\n• दवा का नाम: अल्बेन्डाजोल या इवरमेक्टिन सिरप (वजन के हिसाब से मुँह से दें)।\n• लक्षण: भेड़ का दुबला होना, सुस्त रहना और बाल खुरदरे होना।'),
                        ],
                      ),
                    ),
                  ),

                  // 5. Diarrhea
                  Card(
                    elevation: 3,
                    child: Padding(
                      padding: const EdgeInsets.all(12.0),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            children: [
                              Container(
                                padding: const EdgeInsets.all(8),
                                decoration: BoxDecoration(color: Colors.teal.shade50, borderRadius: BorderRadius.circular(8)),
                                child: const Icon(Icons.medication_liquid, color: Colors.teal, size: 30),
                              ),
                              const SizedBox(width: 12),
                              const Expanded(
                                child: Text('दस्त और पेट खराब (Diarrhea)', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                              ),
                            ],
                          ),
                          const SizedBox(height: 8),
                          const Text('• कब दें: पतला गोबर करते ही तुरंत इलाज शुरू करें।\n• दवा: नेब्लोन बोलस (Neblon) या ओआरएस (ORS) का घोल पानी में मिलाकर पिलाएं।\n• फायदा: शरीर में पानी की कमी (डिहाइड्रेशन) से बचाव होता है।'),
                        ],
                      ),
                    ),
                  ),
                ],
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('एआई भेड़ ट्रैकर एवं स्वास्थ्य देखभाल', style: TextStyle(color: Colors.white)),
                  backgroundColor: Colors.green.shade700,
                  centerTitle: true,
                ),
                body: selectedTab == 0 ? _buildTrackerTab() : _buildMedicineGuideTab(),
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: selectedTab,
                  onTap: (index) {
                    setState(() {
                      selectedTab = index;
                    });
                  },
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.pets), label: 'भेड़ प्रोफाइल'),
                    BottomNavigationBarItem(icon: Icon(Icons.medical_services), label: 'स्वास्थ्य गाइड'),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
