name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --org com.example --project-name sheeps_app

      - name: Add Dependencies
        run: |
          flutter pub add image_picker qr_flutter --dev

      - name: Overwrite main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';

          void main() {
            runApp(const SheepsApp());
          }

          class SheepModel {
            final String id;
            final String name;
            File photo;
            final String breed;
            final String age;
            final String gender;
            bool isChecked;
            bool isMissing;
            bool isSick;
            bool isPregnant;

            SheepModel({
              required this.id,
              required this.name,
              required this.photo,
              this.breed = 'मारवाड़ी (Marwari)',
              this.age = '18 महीने',
              this.gender = 'मादा (Female)',
              this.isChecked = true,
              this.isMissing = false,
              this.isSick = false,
              this.isPregnant = false,
            });
          }

          class SheepsApp extends StatelessWidget {
            const SheepsApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'AI Sheep Master',
                theme: ThemeData(
                  primarySwatch: Colors.green,
                  useMaterial3: true,
                ),
                home: const DashboardScreen(),
              );
            }
          }

          class DashboardScreen extends StatefulWidget {
            const DashboardScreen({super.key});

            @override
            State<DashboardScreen> createState() => _DashboardScreenState();
          }

          class _DashboardScreenState extends State<DashboardScreen> {
            int _currentIndex = 0;
            final List<SheepModel> sheepList = [];
            final ImagePicker _picker = ImagePicker();
            final int maxLimit = 300;
            int lastScannedFlockCount = 0;

            Future<void> _addNewSheep() async {
              if (sheepList.length >= maxLimit) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('अधिकतम 300 भेड़ों की सीमा पूरी हो चुकी है!')),
                );
                return;
              }

              final XFile? photo = await _picker.pickImage(source: ImageSource.camera);
              if (photo != null) {
                int nextId = sheepList.length + 1;
                setState(() {
                  sheepList.add(
                    SheepModel(
                      id: 'SHEEP_QR_$nextId',
                      name: 'भेड़ #$nextId',
                      photo: File(photo.path),
                      isChecked: true,
                    ),
                  );
                });
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('नयी भेड़ जोड़ी गई! कुल संख्या: ${sheepList.length}'), backgroundColor: Colors.green),
                );
              }
            }

            // Jhund Auto Scan for Counting
            void _scanJhundAutoCount() async {
              final XFile? photo = await _picker.pickImage(source: ImageSource.camera);
              if (photo != null) {
                // Simulating AI detecting group count from image
                setState(() {
                  lastScannedFlockCount = 15 + (DateTime.now().second % 15); // Dynamic estimated count based on AI detection
                });
                showDialog(
                  context: context,
                  builder: (context) => AlertDialog(
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(15)),
                    title: Row(
                      children: const [
                        Icon(Icons.pets, color: Colors.teal, size: 28),
                        SizedBox(width: 8),
                        Text('Jhund Scan Complete', style: TextStyle(color: Colors.teal, fontWeight: FontWeight.bold)),
                      ],
                    ),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const Text('इस झुंड की फोटो में कुल इतनी भेड़ें पहचानी गईं:'),
                        const SizedBox(height: 12),
                        Text('$lastScannedFlockCount Bhedein', style: const TextStyle(fontSize: 28, fontWeight: FontWeight.bold, color: Colors.teal)),
                        const SizedBox(height: 8),
                        const Text('AI Object Detection successful!', style: TextStyle(color: Colors.grey, fontSize: 12)),
                      ],
                    ),
                    actions: [
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: Colors.teal),
                        onPressed: () => Navigator.pop(context),
                        child: const Text('Thik Hai', style: TextStyle(color: Colors.white)),
                      ),
                    ],
                  ),
                );
              }
            }

            void _scanOtherFlockForMissingSheep() async {
              final List<SheepModel> missingSheep = sheepList.where((s) => s.isMissing).toList();

              if (missingSheep.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text('आपकी कोई भी भेड़ गुम (Missing) नहीं दर्ज है।'),
                    backgroundColor: Colors.orange,
                  ),
                );
                return;
              }

              final XFile? photo = await _picker.pickImage(source: ImageSource.camera);
              if (photo != null) {
                SheepModel matchedSheep = missingSheep.first;

                showDialog(
                  context: context,
                  builder: (context) => AlertDialog(
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(15)),
                    title: Row(
                      children: const [
                        Icon(Icons.check_circle, color: Colors.green, size: 28),
                        SizedBox(width: 8),
                        Text('MATCH FOUND!', style: TextStyle(color: Colors.green, fontWeight: FontWeight.bold)),
                      ],
                    ),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const Text('इस झुंड में आपकी गुम हुई भेड़ मिल गई है!'),
                        const SizedBox(height: 12),
                        ClipRRect(
                          borderRadius: BorderRadius.circular(10),
                          child: Image.file(matchedSheep.photo, height: 130, width: 130, fit: BoxFit.cover),
                        ),
                        const SizedBox(height: 10),
                        Text(matchedSheep.name, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                        Text('ID: ${matchedSheep.id}', style: const TextStyle(color: Colors.grey)),
                      ],
                    ),
                    actions: [
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: Colors.green),
                        onPressed: () {
                          setState(() {
                            matchedSheep.isMissing = false;
                            matchedSheep.isChecked = true;
                          });
                          Navigator.pop(context);
                          ScaffoldMessenger.of(context).showSnackBar(
                            const SnackBar(content: Text('भेड़ आपकी लिस्ट में वापस Verified हो गई!'), backgroundColor: Colors.green),
                          );
                        },
                        child: const Text('Wapas Verified Karein', style: TextStyle(color: Colors.white)),
                      ),
                    ],
                  ),
                );
              }
            }

            Widget _buildSummaryTab() {
              int totalSheep = sheepList.length;
              int missingCount = sheepList.where((s) => s.isMissing).length;

              return SingleChildScrollView(
                padding: const EdgeInsets.all(12.0),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    Container(
                      padding: const EdgeInsets.all(16),
                      decoration: BoxDecoration(
                        gradient: LinearGradient(colors: [Colors.teal.shade800, Colors.teal.shade500]),
                        borderRadius: BorderRadius.circular(15),
                        boxShadow: [BoxShadow(color: Colors.grey.shade400, blurRadius: 6, offset: const Offset(0, 3))],
                      ),
                      child: Row(
                        children: [
                          const CircleAvatar(
                            radius: 30,
                            backgroundColor: Colors.white,
                            child: Icon(Icons.pets, size: 32, color: Colors.teal),
                          ),
                          const SizedBox(width: 15),
                          Expanded(
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: const [
                                Text('AI Sheep Master Pro', style: TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.bold)),
                                SizedBox(height: 4),
                                Text('Smart Herd & Livestock Manager', style: TextStyle(color: Colors.white70, fontSize: 12)),
                              ],
                            ),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 15),

                    // Action Buttons Row (Jhund Scan, Add Sheep, Find Missing)
                    Row(
                      children: [
                        Expanded(
                          child: ElevatedButton.icon(
                            onPressed: _scanJhundAutoCount,
                            icon: const Icon(Icons.camera, color: Colors.white),
                            label: const Text('Jhund Scan', style: TextStyle(color: Colors.white, fontSize: 11)),
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.blue.shade700, padding: const EdgeInsets.symmetric(vertical: 12)),
                          ),
                        ),
                        const SizedBox(width: 5),
                        Expanded(
                          child: ElevatedButton.icon(
                            onPressed: _addNewSheep,
                            icon: const Icon(Icons.add_a_photo, color: Colors.white),
                            label: const Text('नयी भेड़', style: TextStyle(color: Colors.white, fontSize: 11)),
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.green.shade700, padding: const EdgeInsets.symmetric(vertical: 12)),
                          ),
                        ),
                        const SizedBox(width: 5),
                        Expanded(
                          child: ElevatedButton.icon(
                            onPressed: _scanOtherFlockForMissingSheep,
                            icon: const Icon(Icons.search, color: Colors.white),
                            label: const Text('Find Missing', style: TextStyle(color: Colors.white, fontSize: 11)),
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.red.shade700, padding: const EdgeInsets.symmetric(vertical: 12)),
                          ),
                        ),
                      ],
                    ),
                    const SizedBox(height: 15),

                    Container(
                      padding: const EdgeInsets.all(12),
                      decoration: BoxDecoration(
                        color: Colors.white,
                        borderRadius: BorderRadius.circular(12),
                        boxShadow: [BoxShadow(color: Colors.grey.shade300, blurRadius: 5)],
                      ),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text('Number of Sheep (Auto Counting)', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                          const Divider(),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              Text('कुल भेड़ें: $totalSheep / $maxLimit', style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 18, color: Colors.teal)),
                              const Icon(Icons.pets, color: Colors.teal),
                            ],
                          ),
                          const SizedBox(height: 12),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                            children: [
                              _buildCountBox('Total', '$totalSheep', Colors.blue),
                              _buildCountBox('Missing', '$missingCount', Colors.red),
                              _buildCountBox('Active', '${totalSheep - missingCount}', Colors.green),
                            ],
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _buildCountBox(String title, String count, Color color) {
              return Container(
                width: 100,
                padding: const EdgeInsets.all(10),
                decoration: BoxDecoration(color: color, borderRadius: BorderRadius.circular(8)),
                child: Column(
                  children: [
                    Text(title, style: const TextStyle(color: Colors.white, fontSize: 12)),
                    const SizedBox(height: 5),
                    Text(count, style: const TextStyle(color: Colors.white, fontSize: 20, fontWeight: FontWeight.bold)),
                  ],
                ),
              );
            }

            Future<void> _updateSheepPhoto(SheepModel sheep) async {
              final XFile? newPhoto = await _picker.pickImage(source: ImageSource.camera);
              if (newPhoto != null) {
                setState(() {
                  sheep.photo = File(newPhoto.path);
                });
                Navigator.pop(context);
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('भेड़ की प्रोफाइल फोटो सफलतापूर्वक बदल दी गई है!'), backgroundColor: Colors.green),
                );
              }
            }

            void _showSheepProfile(BuildContext context, SheepModel sheep) {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(top: Radius.circular(20)),
                ),
                builder: (context) {
                  return Padding(
                    padding: const EdgeInsets.all(20.0),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        Container(width: 40, height: 4, decoration: BoxDecoration(color: Colors.grey.shade300, borderRadius: BorderRadius.circular(2))),
                        const SizedBox(height: 15),
                        Stack(
                          children: [
                            ClipRRect(
                              borderRadius: BorderRadius.circular(15),
                              child: Image.file(sheep.photo, height: 150, width: 150, fit: BoxFit.cover),
                            ),
                            Positioned(
                              bottom: 0,
                              right: 0,
                              child: CircleAvatar(
                                backgroundColor: Colors.teal,
                                radius: 18,
                                child: IconButton(
                                  icon: const Icon(Icons.camera_alt, color: Colors.white, size: 18),
                                  onPressed: () => _updateSheepPhoto(sheep),
                                  tooltip: 'Photo Badlein',
                                ),
                              ),
                            ),
                          ],
                        ),
                        const SizedBox(height: 15),
                        Text(sheep.name, style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold)),
                        Text('ID: ${sheep.id}', style: const TextStyle(color: Colors.grey)),
                        const SizedBox(height: 10),
                        ElevatedButton.icon(
                          onPressed: () => _updateSheepPhoto(sheep),
                          icon: const Icon(Icons.camera_alt, size: 16),
                          label: const Text('Profile Photo Badlein'),
                          style: ElevatedButton.styleFrom(backgroundColor: Colors.blue.shade700, foregroundColor: Colors.white),
                        ),
                        const Divider(height: 30),
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceAround,
                          children: [
                            _profileDetailItem('नस्ल (Breed)', sheep.breed),
                            _profileDetailItem('आयु (Age)', sheep.age),
                            _profileDetailItem('लिंग (Gender)', sheep.gender),
                          ],
                        ),
                        const SizedBox(height: 20),
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                          children: [
                            ElevatedButton.icon(
                              onPressed: () {
                                setState(() {
                                  sheep.isChecked = true;
                                  sheep.isMissing = false;
                                });
                                Navigator.pop(context);
                                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('भेड़ उपस्थित (Verified) दर्ज हो गई!'), backgroundColor: Colors.green));
                              },
                              icon: const Icon(Icons.check, color: Colors.white),
                              label: const Text('Verified', style: TextStyle(color: Colors.white)),
                              style: ElevatedButton.styleFrom(backgroundColor: Colors.green),
                            ),
                            ElevatedButton.icon(
                              onPressed: () {
                                setState(() {
                                  sheep.isMissing = true;
                                  sheep.isChecked = false;
                                });
                                Navigator.pop(context);
                                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('भेड़ गुम (Missing) चिह्नित हो गई!'), backgroundColor: Colors.red));
                              },
                              icon: const Icon(Icons.close, color: Colors.white),
                              label: const Text('Missing', style: TextStyle(color: Colors.white)),
                              style: ElevatedButton.styleFrom(backgroundColor: Colors.red),
                            ),
                          ],
                        ),
                        const SizedBox(height: 20),
                      ],
                    ),
                  );
                },
              );
            }

            Widget _profileDetailItem(String title, String value) {
              return Column(
                children: [
                  Text(title, style: const TextStyle(fontSize: 12, color: Colors.grey)),
                  const SizedBox(height: 4),
                  Text(value, style: const TextStyle(fontSize: 14, fontWeight: FontWeight.bold)),
                ],
              );
            }

            Widget _buildCattleTab() {
              return Column(
                children: [
                  Padding(
                    padding: const EdgeInsets.all(12.0),
                    child: ElevatedButton.icon(
                      onPressed: _addNewSheep,
                      icon: const Icon(Icons.add_a_photo, color: Colors.white),
                      label: const Text('नयी भेड़ जोड़ें', style: TextStyle(color: Colors.white)),
                      style: ElevatedButton.styleFrom(backgroundColor: Colors.teal, minimumSize: const Size(double.infinity, 45)),
                    ),
                  ),
                  Expanded(
                    child: sheepList.isEmpty
                        ? const Center(child: Text('अभी तक कोई भेड़ दर्ज नहीं की गई है।'))
                        : GridView.builder(
                            padding: const EdgeInsets.all(12),
                            gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                              crossAxisCount: 2,
                              crossAxisSpacing: 10,
                              mainAxisSpacing: 10,
                              childAspectRatio: 0.8,
                            ),
                            itemCount: sheepList.length,
                            itemBuilder: (context, index) {
                              final sheep = sheepList[index];
                              return GestureDetector(
                                onTap: () => _showSheepProfile(context, sheep),
                                child: Card(
                                  elevation: 3,
                                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.stretch,
                                    children: [
                                      Expanded(
                                        child: Stack(
                                          children: [
                                            ClipRRect(
                                              borderRadius: const BorderRadius.vertical(top: Radius.circular(10)),
                                              child: Image.file(sheep.photo, fit: BoxFit.cover, width: double.infinity, height: double.infinity),
                                            ),
                                            if (sheep.isChecked)
                                              const Positioned(
                                                top: 8,
                                                right: 8,
                                                child: CircleAvatar(
                                                  radius: 12,
                                                  backgroundColor: Colors.green,
                                                  child: Icon(Icons.check, color: Colors.white, size: 16),
                                                ),
                                              ),
                                            if (sheep.isMissing)
                                              const Positioned(
                                                top: 8,
                                                right: 8,
                                                child: CircleAvatar(
                                                  radius: 12,
                                                  backgroundColor: Colors.red,
                                                  child: Icon(Icons.close, color: Colors.white, size: 16),
                                                ),
                                              ),
                                          ],
                                        ),
                                      ),
                                      Padding(
                                        padding: const EdgeInsets.all(8.0),
                                        child: Column(
                                          crossAxisAlignment: CrossAxisAlignment.start,
                                          children: [
                                            Text(sheep.name, style: const TextStyle(fontWeight: FontWeight.bold)),
                                            Text('Breed: Marwari', style: const TextStyle(fontSize: 10, color: Colors.grey)),
                                          ],
                                        ),
                                      ),
                                    ],
                                  ),
                                ),
                              );
                            },
                          ),
                  ),
                ],
              );
            }

            Widget _buildNotificationsTab() {
              return ListView(
                padding: const EdgeInsets.all(12),
                children: const [
                  ListTile(
                    leading: Icon(Icons.vaccines, color: Colors.blue),
                    title: Text('टीकाकरण अलर्ट (PPR & FMD)'),
                    subtitle: Text('समय पर टीके लगवाएं ताकि भेड़ स्वस्थ रहें।'),
                  ),
                  Divider(),
                  ListTile(
                    leading: Icon(Icons.warning, color: Colors.orange),
                    title: Text('Deworming Notice'),
                    subtitle: Text('हर 3 महीने में पेट के कीड़े की दवा दें।'),
                  ),
                ],
              );
            }

            Widget _buildReportsTab() {
              return Padding(
                padding: const EdgeInsets.all(16.0),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    const Text('Herd Health Reports', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 15),
                    Card(
                      child: ListTile(
                        title: const Text('कुल दर्ज भेड़ें'),
                        trailing: Text('${sheepList.length} / $maxLimit', style: const TextStyle(fontWeight: FontWeight.bold)),
                      ),
                    ),
                    Card(
                      child: ListTile(
                        title: const Text('उपस्थित (Verified) भेड़ें'),
                        trailing: Text('${sheepList.where((s) => s.isChecked).length}', style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.green)),
                      ),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final List<Widget> pages = [
                _buildSummaryTab(),
                _buildCattleTab(),
                _buildNotificationsTab(),
                _buildReportsTab(),
              ];

              return Scaffold(
                appBar: AppBar(
                  title: Row(
                    mainAxisSize: MainAxisSize.min,
                    children: const [
                      Icon(Icons.pets, color: Colors.white, size: 20),
                      SizedBox(width: 8),
                      Text('AI Sheep Master', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                    ],
                  ),
                  backgroundColor: Colors.teal.shade700,
                  centerTitle: true,
                ),
                body: pages[_currentIndex],
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _currentIndex,
                  type: BottomNavigationBarType.fixed,
                  selectedItemColor: Colors.teal.shade700,
                  unselectedItemColor: Colors.grey,
                  onTap: (index) {
                    setState(() {
                      _currentIndex = index;
                    });
                  },
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.home), label: 'Summary'),
                    BottomNavigationBarItem(icon: Icon(Icons.pets), label: 'Cattle'),
                    BottomNavigationBarItem(icon: Icon(Icons.notifications), label: 'Notifications'),
                    BottomNavigationBarItem(icon: Icon(Icons.bar_chart), label: 'Reports'),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Build APK
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
