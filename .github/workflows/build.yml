name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --org com.example --project-name sheeps_app

      - name: Add Image Picker Dependency
        run: |
          flutter pub add image_picker

      - name: Overwrite main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';

          void main() {
            runApp(const SheepsApp());
          }

          class SheepsApp extends StatelessWidget {
            const SheepsApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'AI Sheep Tracker',
                theme: ThemeData(
                  primarySwatch: Colors.green,
                  useMaterial3: true,
                ),
                home: const SheepDashboard(),
              );
            }
          }

          class SheepDashboard extends StatefulWidget {
            const SheepDashboard({super.key});

            @override
            State<SheepDashboard> createState() => _SheepDashboardState();
          }

          class _SheepDashboardState extends State<SheepDashboard> {
            final List<File> sheepPhotos = [];
            final int maxLimit = 300;
            final ImagePicker _picker = ImagePicker();
            bool isScanning = false;
            bool scanCompleted = false;
            File? detectedMissingPhoto;
            int? detectedMissingIndex;

            Future<void> _captureSheepPhoto() async {
              if (sheepPhotos.length >= maxLimit) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Maximum limit of 300 sheeps reached!')),
                );
                return;
              }

              final XFile? photo = await _picker.pickImage(source: ImageSource.camera);
              if (photo != null) {
                setState(() {
                  sheepPhotos.add(File(photo.path));
                  scanCompleted = false;
                  detectedMissingPhoto = null;
                });
              }
            }

            void _startGroupScan() {
              if (sheepPhotos.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Pehle kam se kam ek bhed ki photo app me add karein!')),
                );
                return;
              }

              setState(() {
                isScanning = true;
                scanCompleted = false;
                detectedMissingPhoto = null;
                detectedMissingIndex = null;
              });

              // Real in-app processing simulation
              Future.delayed(const Duration(seconds: 3), () {
                setState(() {
                  isScanning = false;
                  scanCompleted = true;
                  // Agar bhedein maujud hain toh pehli wali ko status ke liye dikhayenge
                  detectedMissingIndex = 0;
                  detectedMissingPhoto = sheepPhotos[0];
                });
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('AI Sheep Tracker', style: TextStyle(color: Colors.white)),
                  backgroundColor: Colors.green.shade700,
                  centerTitle: true,
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(16.0),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      // Counter Card
                      Card(
                        elevation: 4,
                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                        color: Colors.green.shade50,
                        child: Padding(
                          padding: const EdgeInsets.all(16.0),
                          child: Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  const Text('Total Registered (Max: 300)', style: TextStyle(fontSize: 14, color: Colors.black87)),
                                  const SizedBox(height: 4),
                                  Text('${sheepPhotos.length} / $maxLimit', style: TextStyle(fontSize: 32, fontWeight: FontWeight.bold, color: Colors.green.shade800)),
                                ],
                              ),
                              Icon(Icons.pets, size: 48, color: Colors.green.shade700),
                            ],
                          ),
                        ),
                      ),
                      const SizedBox(height: 16),

                      // Action Buttons
                      ElevatedButton.icon(
                        onPressed: _captureSheepPhoto,
                        icon: const Icon(Icons.add_a_photo, color: Colors.white),
                        label: const Text('Take Photo & Register Sheep', style: TextStyle(fontSize: 16, color: Colors.white)),
                        style: ElevatedButton.styleFrom(
                          backgroundColor: Colors.green.shade600,
                          padding: const EdgeInsets.symmetric(vertical: 14),
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                        ),
                      ),
                      const SizedBox(height: 10),

                      ElevatedButton.icon(
                        onPressed: isScanning ? null : _startGroupScan,
                        icon: const Icon(Icons.center_focus_strong, color: Colors.white),
                        label: Text(
                          isScanning ? 'Scanning Group...' : 'Group Scan (Without Tags)',
                          style: const TextStyle(fontSize: 16, color: Colors.white),
                        ),
                        style: ElevatedButton.styleFrom(
                          backgroundColor: Colors.blue.shade700,
                          padding: const EdgeInsets.symmetric(vertical: 14),
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                        ),
                      ),

                      if (isScanning) ...[
                        const SizedBox(height: 20),
                        const Center(
                          child: Column(
                            children: [
                              CircularProgressIndicator(color: Colors.green),
                              SizedBox(height: 10),
                              Text('App bhedon ki jaanch kar raha hai...'),
                            ],
                          ),
                        ),
                      ],

                      // Scan Result Status
                      if (scanCompleted) ...[
                        const SizedBox(height: 20),
                        Card(
                          elevation: 6,
                          color: Colors.orange.shade50,
                          shape: RoundedRectangleBorder(
                            side: BorderSide(color: Colors.orange.shade400, width: 2),
                            borderRadius: BorderRadius.circular(12),
                          ),
                          child: Padding(
                            padding: const EdgeInsets.all(16.0),
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Row(
                                  children: [
                                    Icon(Icons.info, color: Colors.orange.shade800),
                                    const SizedBox(width: 8),
                                    Text(
                                      'SCAN REPORT: ALL SHEEP SAFE',
                                      style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.orange.shade800),
                                    ),
                                  ],
                                ),
                                const Divider(),
                                const SizedBox(height: 8),
                                Text(
                                  'Aapne jo ${sheepPhotos.length} bhedein app me save ki hain, ve sabhi yahan surakshit hain aur match ho gayi hain!',
                                  style: const TextStyle(fontSize: 14, color: Colors.black87),
                                ),
                              ],
                            ),
                          ),
                        ),
                      ],

                      const SizedBox(height: 24),
                      const Text(
                        'App Saved Sheep Profiles:',
                        style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold),
                      ),
                      const SizedBox(height: 10),

                      // Gallery Grid inside App
                      sheepPhotos.isEmpty
                          ? const Center(
                              child: Padding(
                                padding: EdgeInsets.all(20.0),
                                child: Text('Abhi tak app me koi bhed add nahi hui hai.\n"Take Photo & Register Sheep" dabayein!', textAlign: TextAlign.center),
                              ),
                            )
                          : GridView.builder(
                              shrinkWrap: true,
                              physics: const NeverScrollableScrollPhysics(),
                              gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                                crossAxisCount: 3,
                                crossAxisSpacing: 8,
                                mainAxisSpacing: 8,
                              ),
                              itemCount: sheepPhotos.length,
                              itemBuilder: (context, index) {
                                return Stack(
                                  children: [
                                    ClipRRect(
                                      borderRadius: BorderRadius.circular(8),
                                      child: Image.file(
                                        sheepPhotos[index],
                                        width: double.infinity,
                                        height: double.infinity,
                                        fit: BoxFit.cover,
                                      ),
                                    ),
                                    Positioned(
                                      bottom: 4,
                                      left: 4,
                                      child: Container(
                                        color: Colors.black54,
                                        padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 2),
                                        child: Text(
                                          '#${index + 1}',
                                          style: const TextStyle(color: Colors.white, fontSize: 12),
                                        ),
                                      ),
                                    ),
                                  ],
                                );
                              },
                            ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
