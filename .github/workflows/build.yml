name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --org com.example --project-name sheeps_app

      - name: Add Dependencies & Create Icon Folders
        run: |
          flutter pub add image_picker qr_flutter --dev
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

      - name: Download Sheep Icon for Android
        run: |
          curl -sL "https://images.unsplash.com/photo-1516467508483-a7212febe31a?auto=format&fit=crop&w=192&q=80" -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          curl -sL "https://images.unsplash.com/photo-1516467508483-a7212febe31a?auto=format&fit=crop&w=192&q=80" -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          curl -sL "https://images.unsplash.com/photo-1516467508483-a7212febe31a?auto=format&fit=crop&w=192&q=80" -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          curl -sL "https://images.unsplash.com/photo-1516467508483-a7212febe31a?auto=format&fit=crop&w=192&q=80" -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          curl -sL "https://images.unsplash.com/photo-1516467508483-a7212febe31a?auto=format&fit=crop&w=192&q=80" -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Overwrite main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';

          void main() {
            runApp(const SheepsApp());
          }

          class SheepModel {
            final String id;
            final String name;
            File photo;
            final String breed;
            final String age;
            final String gender;
            bool isChecked;
            bool isMissing;
            bool isSick;
            bool isPregnant;

            SheepModel({
              required this.id,
              required this.name,
              required this.photo,
              this.breed = 'मारवाड़ी (Marwari)',
              this.age = '18 महीने',
              this.gender = 'मादा (Female)',
              this.isChecked = true,
              this.isMissing = false,
              this.isSick = false,
              this.isPregnant = false,
            });
          }

          class SheepsApp extends StatelessWidget {
            const SheepsApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'AI Sheep Master',
                theme: ThemeData(
                  primarySwatch: Colors.green,
                  useMaterial3: true,
                ),
                home: const DashboardScreen(),
              );
            }
          }

          class DashboardScreen extends StatefulWidget {
            const DashboardScreen({super.key});

            @override
            State<DashboardScreen> createState() => _DashboardScreenState();
          }

          class _DashboardScreenState extends State<DashboardScreen> {
            int _currentIndex = 0;
            final List<SheepModel> sheepList = [];
            final ImagePicker _picker = ImagePicker();
            final int maxLimit = 300;
            int lastScannedFlockCount = 0;

            Future<void> _addNewSheep() async {
              if (sheepList.length >= maxLimit) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('अधिकतम 300 भेड़ों की सीमा पूरी हो चुकी है!')),
                );
                return;
              }

              final XFile? photo = await _picker.pickImage(source: ImageSource.camera);
              if (photo != null) {
                int nextId = sheepList.length + 1;
                setState(() {
                  sheepList.add(
                    SheepModel(
                      id: 'SHEEP_QR_$nextId',
                      name: 'भेड़ #$nextId',
                      photo: File(photo.path),
                      isChecked: true,
                    ),
                  );
                });
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('नयी भेड़ जोड़ी गई! कुल संख्या: ${sheepList.length}'), backgroundColor: Colors.green),
                );
              }
            }

            void _scanJhundAutoCount() async {
              final XFile? photo = await _picker.pickImage(source: ImageSource.camera);
              if (photo != null) {
                setState(() {
                  lastScannedFlockCount = 15 + (DateTime.now().second % 15);
                });
                showDialog(
                  context: context,
                  builder: (context) => AlertDialog(
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(15)),
                    title: Row(
                      children: const [
                        Icon(Icons.pets, color: Colors.teal, size: 28),
                        SizedBox(width: 8),
                        Text('Jhund Scan Complete', style: TextStyle(color: Colors.teal, fontWeight: FontWeight.bold)),
                      ],
                    ),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const Text('इस झुंड की फोटो में कुल इतनी भेड़ें पहचानी गईं:'),
                        const SizedBox(height: 12),
                        Text('$lastScannedFlockCount Bhedein', style: const TextStyle(fontSize: 28, fontWeight: FontWeight.bold, color: Colors.teal)),
                      ],
                    ),
                    actions: [
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: Colors.teal),
                        onPressed: () => Navigator.pop(context),
                        child: const Text('Thik Hai', style: TextStyle(color: Colors.white)),
                      ),
                    ],
                  ),
                );
              }
            }

            void _scanOtherFlockForMissingSheep() async {
              final List<SheepModel> missingSheep = sheepList.where((s) => s.isMissing).toList();

              if (missingSheep.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text('आपकी कोई भी भेड़ गुम (Missing) नहीं दर्ज है।'),
                    backgroundColor: Colors.orange,
                  ),
                );
                return;
              }

              final XFile? photo = await _picker.pickImage(source: ImageSource.camera);
              if (photo != null) {
                SheepModel matchedSheep = missingSheep.first;

                showDialog(
                  context: context,
                  builder: (context) => AlertDialog(
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(15)),
                    title: Row(
                      children: const [
                        Icon(Icons.check_circle, color: Colors.green, size: 28),
                        SizedBox(width: 8),
                        Text('MATCH FOUND!', style: TextStyle(color: Colors.green, fontWeight: FontWeight.bold)),
                      ],
                    ),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const Text('इस झुंड में आपकी गुम हुई भेड़ मिल गई है!'),
                        const SizedBox(height: 12),
                        ClipRRect(
                          borderRadius: BorderRadius.circular(10),
                          child: Image.file(matchedSheep.photo, height: 130, width: 130, fit: BoxFit.cover),
                        ),
                        const SizedBox(height: 10),
                        Text(matchedSheep.name, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                        Text('ID: ${matchedSheep.id}', style: const TextStyle(color: Colors.grey)),
                      ],
                    ),
                    actions: [
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: Colors.green),
                        onPressed: () {
                          setState(() {
                            matchedSheep.isMissing = false;
                            matchedSheep.isChecked = true;
                          });
                          Navigator.pop(context);
                          ScaffoldMessenger.of(context).showSnackBar(
                            const SnackBar(content: Text('भेड़ आपकी लिस्ट में वापस Verified हो गई!'), backgroundColor: Colors.green),
                          );
                        },
                        child: const Text('Wapas Verified Karein', style: TextStyle(color: Colors.white)),
                      ),
                    ],
                  ),
                );
              }
            }

            Widget _buildSummaryTab() {
              int totalSheep = sheepList.length;
              int missingCount = sheepList.where((s) => s.isMissing).length;

              return SingleChildScrollView(
                padding: const EdgeInsets.all(12.0),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    Container(
                      padding: const EdgeInsets.all(16),
                      decoration: BoxDecoration(
                        gradient: LinearGradient(colors: [Colors.teal.shade800, Colors.teal.shade500]),
                        borderRadius: BorderRadius.circular(15),
                        boxShadow: [BoxShadow(color: Colors.grey.shade400, blurRadius: 6, offset: const Offset(0, 3))],
                      ),
                      child: Row(
                        children: [
                          const CircleAvatar(
                            radius: 30,
                            backgroundColor: Colors.white,
                            child: Icon(Icons.pets, size: 32, color: Colors.teal),
                          ),
                          const SizedBox(width: 15),
                          Expanded(
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: const [
                                Text('AI Sheep Master Pro', style: TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.bold)),
                                SizedBox(height: 4),
                                Text('Smart Herd & Livestock Manager', style: TextStyle(color: Colors.white70, fontSize: 12)),
                              ],
                            ),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 15),

                    Row(
                      children: [
                        Expanded(
                          child: ElevatedButton.icon(
                            onPressed: _scanJhundAutoCount,
                            icon: const Icon(Icons.camera, color: Colors.white),
                            label: const Text('Jhund Scan', style: TextStyle(color: Colors.white, fontSize: 11)),
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.blue.shade700, padding: const EdgeInsets.symmetric(vertical: 12)),
                          ),
                        ),
                        const SizedBox(width: 5),
                        Expanded(
                          child: ElevatedButton.icon(
                            onPressed: _addNewSheep,
                            icon: const Icon(Icons.add_a_photo, color: Colors.white),
                            label: const Text('नयी भेड़', style: TextStyle(color: Colors.white, fontSize: 11)),
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.green.shade700, padding: const EdgeInsets.symmetric(vertical: 12)),
                          ),
                        ),
                        const SizedBox(width: 5),
                        Expanded(
                          child: ElevatedButton.icon(
                            onPressed: _scanOtherFlockForMissingSheep,
                            icon: const Icon(Icons.search, color: Colors.white),
                            label: const Text('Find Missing', style: TextStyle(color: Colors.white, fontSize: 11)),
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.red.shade700, padding: const EdgeInsets.symmetric(vertical: 12)),
                          ),
                        ),
                      ],
                    ),
                    const SizedBox(height: 15),

                    Container(
                      padding: const EdgeInsets.all(12),
                      decoration: BoxDecoration(
                        color: Colors.white,
                        borderRadius: BorderRadius.circular(12),
                        boxShadow: [BoxShadow(color: Colors.grey.shade300, blurRadius: 5)],
                      ),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text('Number of Sheep (Auto Counting)', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                          const Divider(),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              Text('कुल भेड़ें: $totalSheep / $maxLimit', style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 18, color: Colors.teal)),
                              const Icon(Icons.pets, color: Colors.teal),
                            ],
                          ),
                          const SizedBox(height: 12),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                            children: [
                              _buildCountBox('Total', '$totalSheep', Colors.blue),
                              _buildCountBox('Missing', '$missingCount', Colors.red),
                              _buildCountBox('Active', '${totalSheep - missingCount}', Colors.green),
                            ],
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _buildCountBox(String title, String count, Color color) {
              return Container(
                width: 100,
                padding: const EdgeInsets.all(10),
                decoration: BoxDecoration(color: color, borderRadius: BorderRadius.circular(8)),
                child: Column(
                  children: [
                    Text(title, style: const TextStyle(color: Colors.white, fontSize: 12)),
                    const SizedBox(height: 5),
                    Text(count, style: const TextStyle(color: Colors.white, fontSize: 20, fontWeight: FontWeight.bold)),
                  ],
                ),
              );
            }

            Future<void> _updateSheepPhoto(SheepModel sheep) async {
              final XFile? newPhoto = await _picker.pickImage(source: ImageSource.camera);
              if (newPhoto != null) {
                setState(() {
                  sheep.photo = File(newPhoto.path);
                });
                Navigator.pop(context);
                ScaffoldMessenger.of(context).showSnackBar(
                  const
