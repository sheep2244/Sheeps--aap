name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: 'stable'

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Restore original main.dart & Fix Android Project
        run: |
          cp lib/main.dart lib/main_backup.dart || true
          flutter create . --org com.example --project-name sheeps_app || true
          cp lib/main_backup.dart lib/main.dart || true
          rm lib/main_backup.dart || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
