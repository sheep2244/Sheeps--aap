name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --org com.example --project-name sheep_master

      - name: Fix Kotlin & SDK Versions
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.24" apply false/' android/settings.gradle || true
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.24'/" android/build.gradle || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle || true

      - name: Add Dependencies
        run: |
          flutter pub add image_picker http geolocator

      - name: Overwrite main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:http/http.dart' as http;
          import 'package:geolocator/geolocator.dart';

          void main() {
            runApp(const SheepMasterApp());
          }

          class SheepModel {
            final String id;
            final String tagNumber;
            final String photoUrl;
            bool isMissing;
            String location;

            SheepModel({
              required this.id,
              required this.tagNumber,
              required this.photoUrl,
              this.isMissing = false,
              this.location = 'Location Unknown',
            });

            factory SheepModel.fromJson(String id, Map<String, dynamic> json) {
              return SheepModel(
                id: id,
                tagNumber: json['tagNumber'] ?? 'No Tag',
                photoUrl: json['photoUrl'] ?? '',
                isMissing: json['isMissing'] ?? false,
                location: json['location'] ?? 'Location Unknown',
              );
            }
          }

          class SheepMasterApp extends StatelessWidget {
            const SheepMasterApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'AI Sheep Master Pro',
                theme: ThemeData(
                  primarySwatch: Colors.teal,
                  scaffoldBackgroundColor: const Color(0xFFF5F7F6),
                  useMaterial3: true,
                ),
                home: const AuthScreen(),
              );
            }
          }

          class AuthScreen extends StatefulWidget {
            const AuthScreen({super.key});

            @override
            State<AuthScreen> createState() => _AuthScreenState();
          }

          class _AuthScreenState extends State<AuthScreen> {
            final TextEditingController _nameController = TextEditingController();
            final TextEditingController _phoneController = TextEditingController();
            final TextEditingController _pinController = TextEditingController();
            bool isLoginMode = true;
            bool isLoading = false;

            final String baseUrl = "https://sheep-master-default-rtdb.firebaseio.com/users";

            Future<void> _submitAuth() async {
              String name = _nameController.text.trim().isEmpty ? 'Kisan Ji' : _nameController.text.trim();
              String phone = _phoneController.text.trim();
              String pin = _pinController.text.trim();

              if (phone.length < 10 || pin.length < 4) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('10-digit Mobile Number aur 4-digit PIN dalein!'), backgroundColor: Colors.red),
                );
                return;
              }

              setState(() => isLoading = true);
              String userUrl = "$baseUrl/$phone.json";

              try {
                final response = await http.get(Uri.parse(userUrl));
                final userData = json.decode(response.body);

                if (isLoginMode) {
                  if (userData != null && userData['pin'] == pin) {
                    String savedName = userData['name'] ?? 'Kisan Ji';
                    if (mounted) {
                      Navigator.pushReplacement(
                        context,
                        MaterialPageRoute(builder: (context) => MainDashboard(userPhone: phone, userName: savedName)),
                      );
                    }
                  } else {
                    if (mounted) {
                      ScaffoldMessenger.of(context).showSnackBar(
                        const SnackBar(content: Text('Galat Number ya PIN! Pehle Naya Account Banayein.'), backgroundColor: Colors.red),
                      );
                    }
                  }
                } else {
                  if (userData != null) {
                    if (mounted) {
                      ScaffoldMessenger.of(context).showSnackBar(
                        const SnackBar(content: Text('Ye Number pehle se registered hai! Login karein.'), backgroundColor: Colors.orange),
                      );
                    }
                  } else {
                    await http.put(Uri.parse(userUrl), body: json.encode({
                      'name': name,
                      'pin': pin,
                      'createdAt': DateTime.now().toIso8601String()
                    }));
                    if (mounted) {
                      Navigator.pushReplacement(
                        context,
                        MaterialPageRoute(builder: (context) => MainDashboard(userPhone: phone, userName: name)),
                      );
                    }
                  }
                }
              } catch (e) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('Internet Connection Check Karein!')),
                  );
                }
              } finally {
                if (mounted) setState(() => isLoading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.teal.shade50,
                body: Center(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(24.0),
                    child: Card(
                      elevation: 6,
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
                      child: Padding(
                        padding: const EdgeInsets.all(24.0),
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            Container(
                              padding: const EdgeInsets.all(14),
                              decoration: BoxDecoration(color: Colors.teal.shade100, shape: BoxShape.circle),
                              child: const Icon(Icons.pets, size: 50, color: Colors.teal),
                            ),
                            const SizedBox(height: 12),
                            Text(
                              isLoginMode ? 'AI Sheep Master Pro' : 'Naya Kisan Account',
                              style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Colors.teal),
                            ),
                            const SizedBox(height: 6),
                            Text(
                              isLoginMode ? 'Apne Mobile Number se Login karein' : '14 Din ka Free Trial shuru karein',
                              style: const TextStyle(fontSize: 13, color: Colors.grey),
                            ),
                            const SizedBox(height: 20),
                            if (!isLoginMode) ...[
                              TextField(
                                controller: _nameController,
                                decoration: const InputDecoration(
                                  labelText: 'Aapka Naam (Jaise: Ram Ji)',
                                  prefixIcon: Icon(Icons.person),
                                  border: OutlineInputBorder(),
                                ),
                              ),
                              const SizedBox(height: 14),
                            ],
                            TextField(
                              controller: _phoneController,
                              keyboardType: TextInputType.phone,
                              maxLength: 10,
                              decoration: const InputDecoration(
                                labelText: 'Mobile Number',
                                prefixIcon: Icon(Icons.phone),
                                border: OutlineInputBorder(),
                                counterText: '',
                              ),
                            ),
                            const SizedBox(height: 14),
                            TextField(
                              controller: _pinController,
                              keyboardType: TextInputType.number,
                              obscureText: true,
                              maxLength: 4,
                              decoration: const InputDecoration(
                                labelText: '4-Digit Secret PIN',
                                prefixIcon: Icon(Icons.lock),
                                border: OutlineInputBorder(),
                                counterText: '',
                              ),
                            ),
                            const SizedBox(height: 20),
                            isLoading
                                ? const CircularProgressIndicator(color: Colors.teal)
                                : ElevatedButton(
                                    style: ElevatedButton.styleFrom(
                                      backgroundColor: Colors.teal.shade700,
                                      minimumSize: const Size.fromHeight(50),
                                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                                    ),
                                    onPressed: _submitAuth,
                                    child: Text(
                                      isLoginMode ? 'Login Karein' : 'Account Banayein',
                                      style: const TextStyle(color: Colors.white, fontSize: 16, fontWeight: FontWeight.bold),
                                    ),
                                  ),
                            const SizedBox(height: 12),
                            TextButton(
                              onPressed: () => setState(() => isLoginMode = !isLoginMode),
                              child: Text(
                                isLoginMode ? 'Naya User? Yahan Account Banayein' : 'Pehle se Account hai? Login Karein',
                                style: const TextStyle(color: Colors.teal, fontWeight: FontWeight.bold),
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class MainDashboard extends StatefulWidget {
            final String userPhone;
            final String userName;
            const MainDashboard({super.key, required this.userPhone, required this.userName});

            @override
            State<MainDashboard> createState() => _MainDashboardState();
          }

          class _MainDashboardState extends State<MainDashboard> {
            int _currentIndex = 0;
            bool isHindi = true;
            final List<SheepModel> sheepList = [];
            final ImagePicker _picker = ImagePicker();
            bool isLoading = false;

            String get userSheepUrl => "https://sheep-master-default-rtdb.firebaseio.com/users/${widget.userPhone}/sheep.json";

            @override
            void initState() {
              super.initState();
              _fetchOnlineData();
            }

            Future<void> _fetchOnlineData() async {
              setState(() => isLoading = true);
              try {
                final response = await http.get(Uri.parse(userSheepUrl));
                if (response.statusCode == 200 && response.body != 'null') {
                  final Map<String, dynamic> data = json.decode(response.body);
                  List<SheepModel> loadedSheep = [];
                  data.forEach((key, value) {
                    loadedSheep.add(SheepModel.fromJson(key, value));
                  });
                  setState(() {
                    sheepList.clear();
                    sheepList.addAll(loadedSheep);
                  });
                }
              } catch (e) {
                // Ignore
              } finally {
                setState(() => isLoading = false);
              }
            }

            Future<String> _getGpsLocation() async {
              try {
                bool serviceEnabled = await Geolocator.isLocationServiceEnabled();
                if (!serviceEnabled) return 'GPS Off';

                LocationPermission permission = await Geolocator.checkPermission();
                if (permission == LocationPermission.denied) {
                  permission = await Geolocator.requestPermission();
                  if (permission == LocationPermission.denied) return 'No Permission';
                }

                Position pos = await Geolocator.getCurrentPosition(desiredAccuracy: LocationAccuracy.high);
                return '${pos.latitude.toStringAsFixed(4)},${pos.longitude.toStringAsFixed(4)}';
              } catch (e) {
                return 'Location Error';
              }
            }

            Future<void> _addNewSheep() async {
              final XFile? photo = await _picker.pickImage(source: ImageSource.camera, imageQuality: 45);
              if (photo == null) return;

              TextEditingController tagController = TextEditingController(text: 'Tag #${sheepList.length + 1}');

              if (!mounted) return;
              bool? confirm = await showDialog<bool>(
                context: context,
                barrierDismissible: false,
                builder: (ctx) => AlertDialog(
                  title: Text(isHindi ? 'Bhed ki Digital ID' : 'Sheep Digital ID'),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      ClipRRect(
                        borderRadius: BorderRadius.circular(10),
                        child: Image.file(File(photo.path), height: 120, width: 120, fit: BoxFit.cover),
                      ),
                      const SizedBox(height: 12),
                      TextField(
                        controller: tagController,
                        decoration: InputDecoration(
                          labelText: isHindi ? 'Ear Tag Number ya Naam' : 'Ear Tag Number or Name',
                          border: const OutlineInputBorder(),
                        ),
                      ),
                    ],
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx, false), child: Text(isHindi ? 'Cancel' : 'Cancel')),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: Colors.teal),
                      onPressed: () => Navigator.pop(ctx, true),
                      child: Text(isHindi ? 'Save Karein' : 'Save', style: const TextStyle(color: Colors.white)),
                    ),
                  ],
                ),
              );

              if (confirm == true) {
                setState(() => isLoading = true);
                String tag = tagController.text.trim().isEmpty ? 'Tag #${sheepList.length + 1}' : tagController.text.trim();
                String locationStr = await _getGpsLocation();

                List<int> imageBytes = await File(photo.path).readAsBytes();
                String dataUrl = "data:image/jpeg;base64,${base64Encode(imageBytes)}";

                Map<String, dynamic> newSheepData = {
                  'tagNumber': tag,
                  'photoUrl': dataUrl,
                  'isMissing': false,
                  'location': locationStr,
                };

                try {
                  final response = await http.post(Uri.parse(userSheepUrl), body: json.encode(newSheepData));
                  if (response.statusCode == 200) {
                    final responseData = json.decode(response.body);
                    setState(() {
                      sheepList.add(SheepModel(
                        id: responseData['name'],
                        tagNumber: tag,
                        photoUrl: dataUrl,
                        location: locationStr,
                      ));
                    });
                  }
                } catch (e) {
                  // Error
                } finally {
                  setState(() => isLoading = false);
                }
              }
            }

            Future<void> _toggleMissingStatus(int index) async {
              final sheep = sheepList[index];
              bool updatedStatus = !sheep.isMissing;
              setState(() => sheepList[index].isMissing = updatedStatus);

              String updateUrl = "https://sheep-master-default-rtdb.firebaseio.com/users/${widget.userPhone}/sheep/${sheep.id}.json";
              try {
                await http.patch(Uri.parse(updateUrl), body: json.encode({'isMissing': updatedStatus}));
              } catch (e) {}
            }

            void _showMissingSheepDialog() {
              final missingList = sheepList.where((s) => s.isMissing).toList();
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: Row(
                    children: [
                      const Icon(Icons.location_on, color: Colors.red),
                      const SizedBox(width: 6),
                      Expanded(child: Text(isHindi ? 'Khoyi Hui Bhed ki Location' : 'Missing Sheep Locations', style: const TextStyle(fontSize: 16))),
                    ],
                  ),
                  content: SizedBox(
                    width: double.maxFinite,
                    child: missingList.isEmpty
                        ? Text(isHindi ? 'Abhi koi bhi bhed gumshuda nahi hai! Sab surakshit hain.' : 'No missing sheep! All are safe.')
                        : ListView.builder(
                            shrinkWrap: true,
                            itemCount: missingList.length,
                            itemBuilder: (context, i) {
                              final s = missingList[i];
                              return ListTile(
                                leading: const Icon(Icons.warning_amber_rounded, color: Colors.red),
                                title: Text(s.tagNumber, style: const TextStyle(fontWeight: FontWeight.bold)),
                                subtitle: Text('Last GPS: ${s.location}'),
                              );
                            },
                          ),
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Band Karein')),
                  ],
                ),
              );
            }

            void _showAdviceDialog(String title, String advice) {
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: Text(title, style: const TextStyle(color: Colors.teal, fontWeight: FontWeight.bold)),
                  content: Text(advice, style: const TextStyle(fontSize: 15, height: 1.4)),
                  actions: [
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: Colors.teal),
                      onPressed: () => Navigator.pop(ctx),
                      child: const Text('Samajh Gaya', style: TextStyle(color: Colors.white)),
                    ),
                  ],
                ),
              );
            }

            void _logout() {
              Navigator.pushReplacement(context, MaterialPageRoute(builder: (context) => const AuthScreen()));
            }

            @override
            Widget build(BuildContext context) {
              int totalSheep = sheepList.length;
              int missingSheep = sheepList.where((s) => s.isMissing).length;
              int activeSheep = totalSheep - missingSheep;

              return Scaffold(
                appBar: AppBar(
                  title: const Text('AI Sheep Master Pro', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 18)),
                  backgroundColor: Colors.teal.shade800,
                  actions: [
                    GestureDetector(
                      onTap: () => setState(() => isHindi = !isHindi),
                      child: Container(
                        margin: const EdgeInsets.symmetric(vertical: 12, horizontal: 6),
                        padding: const EdgeInsets.symmetric(horizontal: 10),
                        decoration: BoxDecoration(
                          color: Colors.white24,
                          borderRadius: BorderRadius.circular(16),
                        ),
                        alignment: Alignment.center,
                        child: Text(isHindi ? 'En | हिं' : 'हिं | En', style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 12)),
                      ),
                    ),
                    IconButton(icon: const Icon(Icons.refresh, color: Colors.white), onPressed: _fetchOnlineData),
                    IconButton(icon: const Icon(Icons.logout, color: Colors.white), onPressed: _logout),
                  ],
                ),
                body: _currentIndex == 0
                    ? isLoading
                        ? const Center(child: CircularProgressIndicator(color: Colors.teal))
                        : SingleChildScrollView(
                            padding: const EdgeInsets.all(12),
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.stretch,
                              children: [
                                Card(
                                  elevation: 1,
                                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                                  child: Padding(
                                    padding: const EdgeInsets.all(12),
                                    child: Row(
                                      children: [
                                        CircleAvatar(
                                          radius: 24,
                                          backgroundColor: Colors.teal.shade100,
                                          child: const Icon(Icons.person, color: Colors.teal, size: 28),
                                        ),
                                        const SizedBox(width: 12),
                                        Expanded(
                                          child: Column(
                                            crossAxisAlignment: CrossAxisAlignment.start,
                                            children: [
                                              Text(widget.userName, style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                                              Text('ID: ${widget.userPhone} • India', style: const TextStyle(fontSize: 12, color: Colors.grey)),
                                            ],
                                          ),
                                        ),
                                        Container(
                                          padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                                          decoration: BoxDecoration(color: Colors.orange.shade100, borderRadius: BorderRadius.circular(12)),
                                          child: const Text('Pro Active', style: TextStyle(color: Colors.deepOrange, fontSize: 11, fontWeight: FontWeight.bold)),
                                        ),
                                      ],
                                    ),
                                  ),
                                ),
                                const SizedBox(height: 8),
                                Container(
                                  padding: const EdgeInsets.all(14),
                                  decoration: BoxDecoration(
                                    color: const Color(0xFFE6D598),
                                    borderRadius: BorderRadius.circular(14),
                                  ),
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Text(isHindi ? '14 दिन का फ्री ट्रायल' : '14 Days Free Trial', style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.black87)),
                                      const SizedBox(height: 2),
                                      Text(isHindi ? 'सभी Pro फीचर्स अनलॉक हैं' : 'All Pro features unlocked', style: const TextStyle(fontSize: 12, color: Colors.black54)),
                                    ],
                                  ),
                                ),
                                const SizedBox(height: 12),
                                Container(
                                  padding: const EdgeInsets.all(14),
                                  decoration: BoxDecoration(
                                    color: Colors.white,
                                    borderRadius: BorderRadius.circular(1
